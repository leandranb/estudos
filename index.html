<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mentor de Estudos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Direção: caderno calmo. Papel quente, tinta escura, um único acento (terracota) usado com parcimônia.
   Cor de matéria só como pontinho; tudo o mais em tons neutros. Um dia aberto por vez. */
:root{
  --bg:#F5F2EC; --surface:#FBFAF7; --sunk:#EFEBE3; --ink:#23241F; --muted:#6E6B62; --faint:#9C978C;
  --line:#E4DED3; --line-2:#ECE7DE;
  --accent:#B4532A; --accent-ink:#FFF9F3; --accent-soft:#F4E5DB;
  --ok:#4E7F5E; --ok-soft:#E3EEE5; --warn:#A06F22; --warn-soft:#F5EAD3; --bad:#B4483A; --bad-soft:#F6E1DC;
  --shadow:0 1px 2px rgba(50,40,20,.04),0 8px 24px -16px rgba(50,40,20,.18);
  --r:14px;
  --f-head:'Outfit',system-ui,sans-serif; --f-body:'DM Sans',system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#171714; --surface:#1F1F1B; --sunk:#252520; --ink:#ECE8DF; --muted:#A6A195; --faint:#77736A;
  --line:#34332D; --line-2:#2B2A25; --accent:#E07A4F; --accent-ink:#1B1410; --accent-soft:#3A251B;
  --ok:#8DBB9A; --ok-soft:#1F3026; --warn:#D9A75A; --warn-soft:#352A17; --bad:#E08070; --bad-soft:#3A221D;
  --shadow:0 1px 2px rgba(0,0,0,.25),0 12px 28px -18px rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#171714; --surface:#1F1F1B; --sunk:#252520; --ink:#ECE8DF; --muted:#A6A195; --faint:#77736A;
  --line:#34332D; --line-2:#2B2A25; --accent:#E07A4F; --accent-ink:#1B1410; --accent-soft:#3A251B;
  --ok:#8DBB9A; --ok-soft:#1F3026; --warn:#D9A75A; --warn-soft:#352A17; --bad:#E08070; --bad-soft:#3A221D;
  --shadow:0 1px 2px rgba(0,0,0,.25),0 12px 28px -18px rgba(0,0,0,.6); color-scheme:dark}

*{box-sizing:border-box}
html,body{margin:0}
body{font-family:var(--f-body);background:var(--bg);color:var(--ink);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
h1,h2,h3,button,.btn,.eyebrow,th,.num-big{font-family:var(--f-head)}
h1,h2,h3{margin:0;font-weight:500;letter-spacing:-.01em;text-wrap:balance}
p{margin:0}
input,select,textarea{font-family:var(--f-body);font-size:14px;color:var(--ink)}
button{cursor:pointer;font-size:14px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);font-weight:500}
.muted{color:var(--muted)} .faint{color:var(--faint)} .small{font-size:13px}
.wrap{max-width:1080px;margin:0 auto;padding:0 max(16px,env(safe-area-inset-left,0px))}

/* Campos e botões */
input,select,textarea{border:1px solid var(--line);border-radius:10px;padding:8px 11px;background:var(--surface);transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:7px 16px;font-weight:500;transition:border-color .15s,background .15s}
.btn:hover{border-color:var(--faint)}
.btn.pri{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.btn.pri:hover{opacity:.9}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--ink);background:var(--sunk)}
.btn.danger{color:var(--bad)}
.ico{border:none;background:transparent;color:var(--faint);width:30px;height:30px;border-radius:8px;display:inline-grid;place-items:center;font-size:15px;transition:color .15s,background .15s}
.ico:hover{color:var(--ink);background:var(--sunk)}
.ico.danger:hover{color:var(--bad);background:var(--bad-soft)}

/* Topo */
header{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line-2)}
.topo{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-top:18px;flex-wrap:wrap}
.marca h1{font-size:22px;font-weight:500;line-height:1.2}
.marca .eyebrow{margin-bottom:2px}
.topo-dir{display:flex;align-items:center;gap:6px;position:relative}
.contagem{display:flex;align-items:center;gap:10px;border:none;background:transparent;padding:4px 10px;border-radius:12px;color:var(--ink);text-align:left}
.contagem:hover{background:var(--sunk)}
.contagem .n{font-family:var(--f-head);font-size:30px;font-weight:500;line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.contagem .l{font-family:var(--f-body);font-size:12px;color:var(--muted);line-height:1.3}
.horas{display:flex;align-items:center;gap:4px;font-size:13px;color:var(--muted);padding:0 8px;border-left:1px solid var(--line);margin-left:4px}
.horas input{width:38px;padding:5px 6px;text-align:center;border-color:transparent;background:transparent;font-family:var(--f-head);font-size:15px;font-weight:500}
.horas input:hover{border-color:var(--line)}
.pop{position:absolute;top:calc(100% + 8px);right:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:0 18px 50px -20px rgba(0,0,0,.35);padding:16px;width:290px;display:none;z-index:30}
.pop.open{display:block}
.pop .campos{display:flex;flex-direction:column;gap:8px;margin-top:14px;padding-top:14px;border-top:1px solid var(--line-2)}
.pop label{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:8px;justify-content:space-between}
.cal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-family:var(--f-head);font-weight:500}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center;font-size:12px}
.cal-grid .dow{color:var(--faint);font-family:var(--f-head);padding-bottom:4px}
.cal-grid .d{padding:6px 0;border-radius:8px;color:var(--muted)}
.cal-grid .d.plano{color:var(--ink)}
.cal-grid .d.out{color:var(--line)}
.cal-grid .d.hoje{box-shadow:inset 0 0 0 1.5px var(--ink);color:var(--ink);font-weight:600}
.cal-grid .d.prova{background:var(--accent);color:var(--accent-ink);font-weight:600}

nav.abas{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;margin-top:12px}
.tab{border:none;background:none;padding:10px 12px 12px;color:var(--muted);font-weight:400;border-bottom:2px solid transparent;white-space:nowrap;font-size:14px}
.tab:hover{color:var(--ink)}
.tab.on{color:var(--ink);border-bottom-color:var(--ink);font-weight:500}
main.wrap{padding-top:28px;padding-bottom:80px}

.aviso{display:flex;align-items:center;gap:12px;justify-content:space-between;font-size:13px;color:var(--muted);background:var(--sunk);border-radius:12px;padding:10px 14px;margin-bottom:24px}
.aviso b{color:var(--ink);font-weight:500}
.aviso.acao{background:var(--accent-soft);color:var(--ink)}

/* Cabeçalho de seção */
.sec-h{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.sec-h h2{font-size:28px;line-height:1.15}
.sec-h .sub{color:var(--muted);margin-top:4px}
.seg{display:inline-flex;background:var(--sunk);border-radius:999px;padding:3px}
.seg button{border:none;background:transparent;color:var(--muted);border-radius:999px;padding:6px 14px;font-size:13px}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}

/* Semanas (sub-abas) */
.semanas{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;margin-bottom:28px;padding-bottom:2px}
.semanas button{flex:none;min-width:38px;height:34px;border:none;background:transparent;border-radius:10px;color:var(--faint);font-size:13px;font-variant-numeric:tabular-nums;position:relative}
.semanas button:hover{background:var(--sunk);color:var(--ink)}
.semanas button.on{background:var(--ink);color:var(--bg)}
.semanas button.atual:not(.on)::after{content:"";position:absolute;bottom:3px;left:50%;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--accent)}
.semanas button.rev:not(.on){color:var(--accent)}

/* Dias como linhas */
.dias{display:flex;flex-direction:column;gap:8px}
.dia{background:var(--surface);border:1px solid var(--line-2);border-radius:var(--r);transition:border-color .15s,background .15s}
.dia.aberto{border-color:var(--line);box-shadow:var(--shadow)}
.dia.over{border-color:var(--accent);background:var(--accent-soft)}
.dia.fora{opacity:.5}
.dia-h{width:100%;display:grid;grid-template-columns:120px 1fr auto 20px;gap:16px;align-items:center;border:none;background:none;padding:14px 18px;text-align:left;color:var(--ink);font-family:var(--f-body)}
.dia-h .nome{font-family:var(--f-head);font-weight:500;font-size:15px}
.dia-h .nome span{font-family:var(--f-body);font-weight:400;color:var(--faint);font-size:13px;margin-left:6px}
.dia-h .hoje-tag{display:inline-block;margin-left:8px;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);font-family:var(--f-head);font-weight:600}
.dia-h .mats{color:var(--muted);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.dia-h .tempo{font-size:13px;color:var(--faint);font-variant-numeric:tabular-nums;white-space:nowrap}
.dia-h .tempo b{color:var(--ink);font-weight:500}
.dia-h .chev{color:var(--faint);transition:transform .2s;font-size:14px}
.dia.aberto .chev{transform:rotate(90deg)}
.dia-warn{margin:-6px 18px 10px;font-size:12.5px;color:var(--bad)}
.dia-corpo{padding:2px 18px 18px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:8px}
.add{margin-top:10px;border:1px dashed var(--line);background:transparent;color:var(--faint);border-radius:12px;padding:9px;width:100%;font-size:13px;transition:color .15s,border-color .15s}
.add:hover{color:var(--ink);border-color:var(--faint)}
.mdot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--c);margin-right:6px;vertical-align:1px;flex:none}
.mat-nome{display:inline-flex;align-items:center;margin-right:14px}

/* Card */
.card{position:relative;display:grid;grid-template-columns:22px 1fr;gap:10px 12px;align-items:start;background:var(--bg);border:1px solid transparent;border-radius:12px;padding:12px 12px 10px;cursor:grab;transition:border-color .15s,background .15s}
.card:hover{border-color:var(--line);background:var(--surface)}
.card.drag{opacity:.35}
.check{appearance:none;width:20px;height:20px;margin:1px 0 0;border-radius:50%;border:1.5px solid var(--faint);background:transparent;display:grid;place-items:center;padding:0;transition:all .15s}
.check:hover{border-color:var(--ink)}
.check.on{background:var(--ink);border-color:var(--ink)}
.check.on::after{content:"";width:5px;height:9px;border:solid var(--bg);border-width:0 2px 2px 0;transform:translateY(-1px) rotate(45deg)}
.c-tit{font-size:14.5px;line-height:1.4;word-break:break-word}
.card.fin .c-tit{color:var(--faint);text-decoration:line-through;text-decoration-color:var(--line)}
.c-meta{display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px;margin-top:4px;font-size:12.5px;color:var(--muted)}
.c-meta .sep{color:var(--line)}
.inc{display:inline-flex;align-items:center;gap:5px}
.inc::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--ic)}
.inc-alta{--ic:var(--accent)} .inc-media{--ic:var(--warn)} .inc-baixa{--ic:var(--faint)}
.tag-inc{display:inline-block;font-size:11.5px;padding:1px 8px;border-radius:999px;background:color-mix(in srgb,var(--ic) 12%,transparent);color:var(--ink)}
.tag-inc.inc::before{display:none}
.st{font-size:11.5px;padding:1px 8px;border-radius:999px;font-family:var(--f-head);font-weight:500}
.st-afazer{background:transparent;color:var(--faint);padding-left:0}
.st-iniciado{background:color-mix(in srgb,#5C7FB0 16%,transparent);color:var(--ink)}
.st-revisar{background:var(--warn-soft);color:var(--ink)}
.st-finalizado{background:var(--ok-soft);color:var(--ink)}
.st-nao{background:transparent;color:var(--faint);padding-left:0}
.c-acts{margin-left:auto;display:inline-flex;align-items:center;opacity:0;transition:opacity .15s}
.c-acts .ico{width:26px;height:26px;font-size:14px}
.card:hover .c-acts,.card:focus-within .c-acts{opacity:1}
@media (hover:none){.c-acts{opacity:1}}

.como{appearance:none;-webkit-appearance:none;border:none;background-color:transparent;color:var(--muted);font-size:12.5px;padding:4px 18px 4px 4px;margin-right:4px;cursor:pointer;
  background-image:linear-gradient(45deg,transparent 50%,var(--faint) 50%),linear-gradient(135deg,var(--faint) 50%,transparent 50%);
  background-position:calc(100% - 9px) 55%,calc(100% - 5px) 55%;background-size:4px 4px;background-repeat:no-repeat}
.como:hover{color:var(--ink)}
.como:focus{box-shadow:none}

/* Kanban */
.kanban{display:grid;grid-template-columns:repeat(4,minmax(230px,1fr));gap:12px;overflow-x:auto;padding-bottom:6px}
.lane{background:var(--sunk);border-radius:var(--r);padding:12px;min-height:360px;display:flex;flex-direction:column;gap:6px;border:1px solid transparent;transition:border-color .15s,background .15s}
.lane.over{border-color:var(--accent);background:var(--accent-soft)}
.lane-h{display:flex;justify-content:space-between;align-items:center;padding:2px 4px 8px;font-family:var(--f-head);font-weight:500;font-size:14px}
.lane-h span{color:var(--faint);font-weight:400;font-variant-numeric:tabular-nums}
.lane .card{background:var(--surface);border-color:var(--line-2)}
.lane .zona{display:flex;flex-direction:column;gap:6px;flex:1}

/* Blocos genéricos */
.bloco{background:var(--surface);border:1px solid var(--line-2);border-radius:var(--r);padding:22px 24px;margin-bottom:16px}
.bloco > h3{font-size:17px;margin-bottom:4px}
.bloco > .sub{color:var(--muted);font-size:13.5px;margin-bottom:18px}
details.bloco > summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;font-family:var(--f-head);font-weight:500;font-size:15px}
details.bloco > summary::-webkit-details-marker{display:none}
details.bloco > summary::after{content:"›";color:var(--faint);transition:transform .2s}
details.bloco[open] > summary::after{transform:rotate(90deg)}
details.bloco[open] > summary{margin-bottom:14px}
.metas{margin-top:24px}

/* Números */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:1px;background:var(--line-2);border:1px solid var(--line-2);border-radius:var(--r);overflow:hidden;margin-bottom:16px}
.kpi{background:var(--surface);padding:20px 22px}
.kpi .num-big{display:block;font-size:32px;font-weight:500;letter-spacing:-.02em;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi span{font-size:13px;color:var(--muted)}

/* Tabelas */
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line-2);vertical-align:middle}
th{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);font-weight:500}
tr:last-child td{border-bottom:none}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
td select{border-color:transparent;background:transparent;padding:4px 6px}
td select:hover{border-color:var(--line)}

/* Barras */
.barras{display:flex;flex-direction:column;gap:12px}
.barrow{display:grid;grid-template-columns:minmax(120px,230px) 1fr 120px;gap:16px;align-items:center;font-size:14px}
.barrow .v{text-align:right;font-variant-numeric:tabular-nums;font-size:13px;color:var(--muted)}
.bar{height:6px;background:var(--sunk);border-radius:99px;overflow:hidden;position:relative}
.bar > i{position:absolute;inset:0 auto 0 0;border-radius:99px;background:var(--c,var(--ink))}
.bar > i.plan{background:color-mix(in srgb,var(--c,var(--ink)) 22%,transparent)}
.distrib{display:flex;height:10px;border-radius:99px;overflow:hidden;gap:2px;margin:6px 0 18px}
.distrib i{display:block;height:100%;background:var(--c)}

.pct{font-family:var(--f-head);font-weight:500;padding:2px 9px;border-radius:999px;font-size:13px;font-variant-numeric:tabular-nums}
.pct.r{color:var(--bad);background:var(--bad-soft)}
.pct.y{color:var(--warn);background:var(--warn-soft)}
.pct.g{color:var(--ok);background:var(--ok-soft)}

.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;align-items:end}
.form-grid label,.campo{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12.5px;background:var(--sunk);color:var(--muted);border-radius:999px;padding:3px 10px}
.chip.ok{background:var(--ok-soft);color:var(--ink)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}

.mat-h{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:12px}
.mat-h h3{font-size:17px;display:flex;align-items:center}
.mat-h label{font-size:12.5px;color:var(--faint);display:flex;align-items:center;gap:6px}
.mat-h input[type=number]{width:60px;padding:5px 8px}
.mat-h input[type=color]{width:22px;height:22px;padding:0;border:none;border-radius:50%;background:none;cursor:pointer}
.mat-h input[type=color]::-webkit-color-swatch-wrapper{padding:0}
.mat-h input[type=color]::-webkit-color-swatch{border:none;border-radius:50%}

dialog{border:none;border-radius:20px;padding:0;max-width:540px;width:calc(100% - 32px);background:var(--surface);color:var(--ink);box-shadow:0 30px 80px -20px rgba(0,0,0,.4)}
dialog::backdrop{background:rgba(30,25,15,.32);backdrop-filter:blur(2px)}
.modal-c{padding:26px}
.modal-c h2{font-size:22px;margin-bottom:18px}
.modal-c .form-grid{grid-template-columns:1fr 1fr}
.modal-c .full{grid-column:1/-1}
.modal-f{display:flex;justify-content:flex-end;gap:8px;margin-top:22px;flex-wrap:wrap}
.modal-sec{margin-top:22px;padding-top:18px;border-top:1px solid var(--line-2)}

/* Pomodoro: pílula flutuante discreta que abre um painel pequeno */
#pomo{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:max(16px,env(safe-area-inset-bottom,0px));z-index:40;display:flex;flex-direction:column;align-items:flex-end;gap:10px}
.pomo-pill{display:inline-flex;align-items:center;gap:9px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:9px 16px 9px 12px;box-shadow:var(--shadow);font-variant-numeric:tabular-nums;font-weight:500;font-size:15px;transition:background .2s,color .2s}
.pomo-pill:hover{border-color:var(--faint)}
.pomo-pill .lbl{color:var(--faint);font-weight:400;font-family:var(--f-body);font-size:13px}
.pomo-pill .pdot{width:8px;height:8px;border-radius:50%;background:var(--pc,var(--accent))}
.pomo-pill.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.pomo-pill.on .lbl{color:color-mix(in srgb,var(--bg) 62%,transparent)}
.pomo-pill.on .pdot{animation:respira 2.4s ease-in-out infinite}
@keyframes respira{50%{opacity:.3}}
.pomo-panel{width:300px;max-width:calc(100vw - 32px);background:var(--surface);border:1px solid var(--line);border-radius:20px;box-shadow:0 24px 60px -24px rgba(0,0,0,.4);padding:18px;display:flex;flex-direction:column;gap:14px}
.pp-h{display:flex;justify-content:space-between;align-items:center}
.pp-fases{align-self:center}
.pp-ring{position:relative;width:156px;height:156px;align-self:center}
.pp-ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.pp-ring circle{fill:none;stroke-width:5}
.pp-ring .trilho{stroke:var(--sunk)}
.pp-ring .prog{stroke:var(--pc,var(--accent));stroke-linecap:round;transition:stroke-dashoffset .5s linear}
.pp-t{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.pp-t span{font-family:var(--f-head);font-size:38px;font-weight:500;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1}
.pp-t small{color:var(--muted);font-size:12.5px}
.pp-ctrl{display:flex;justify-content:center;align-items:center;gap:4px}
.pp-ctrl .btn.pri{min-width:110px}
.pomo-panel select{width:100%}
.pp-campos{display:flex;flex-direction:column;gap:8px}
.pp-chk{font-size:13px;color:var(--muted);display:flex;gap:8px;align-items:center;cursor:pointer}
.pomo-panel details summary{font-size:13px;color:var(--muted);cursor:pointer;list-style:none}
.pomo-panel details summary::-webkit-details-marker{display:none}
.pp-cfg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.pp-cfg label{font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
.pp-cfg input{padding:6px 8px}
@media (prefers-reduced-motion:reduce){.pomo-pill.on .pdot{animation:none}}
.sync{display:inline-flex;align-items:center;gap:7px;border:none;background:transparent;color:var(--muted);font-family:var(--f-body);font-size:12.5px;padding:6px 10px;border-radius:999px;white-space:nowrap}
.sync:hover{background:var(--sunk);color:var(--ink)}
.sync .sdot{width:7px;height:7px;border-radius:50%;background:var(--faint)}
.sync.s-ok .sdot{background:var(--ok)}
.sync.s-salvando .sdot{background:var(--warn);animation:respira 1.6s ease-in-out infinite}
.sync.s-erro{color:var(--bad)} .sync.s-erro .sdot{background:var(--bad)}
.sync.s-entrar{color:var(--ink)} .sync.s-entrar .sdot{background:var(--accent)}
@media (max-width:720px){.sync{font-size:0;gap:0;padding:10px}.sync .sdot{width:9px;height:9px}}
#toast{position:fixed;bottom:24px;left:50%;transform:translate(-50%,8px);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;z-index:100;max-width:90vw}
#toast.on{opacity:1;transform:translate(-50%,0)}
@media (max-width:720px){
  .dia-h{grid-template-columns:1fr auto 16px;gap:10px}
  .dia-h .mats{grid-column:1/-1;grid-row:2;white-space:normal}
  .barrow{grid-template-columns:1fr auto;gap:6px 12px}.barrow .bar{grid-column:1/-1;grid-row:2}
  .sec-h h2{font-size:24px}
  .bloco{padding:18px}
  .horas{border-left:none;padding:0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

<script>
/* ================= Utilidades ================= */
const STORAGE_KEY = 'mentor-concursos-v1';
/* Sincronização entre aparelhos (opcional): URL e chave PÚBLICA (anon/publishable) do Supabase.
   Pode deixar vazio e preencher pelo app (⚙ → Sincronização). Nunca coloque a service_role aqui. */
const SUPABASE_PADRAO = { url: '', chave: '' };
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Math.random().toString(36).slice(2, 10);
const pd = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const iso = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
const addD = (d, n) => { const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); x.setDate(x.getDate() + n); return x; };
const monday = d => addD(d, -((d.getDay() + 6) % 7));
const diffDias = (a, b) => Math.round((b - a) / 864e5);
const hoje = () => iso(new Date());
const fmtBR = s => s ? s.split('-').reverse().join('/') : '—';
const fmtCurto = s => { const [, m, d] = s.split('-'); return `${d}/${m}`; };
const fmtH = min => { min = Math.max(0, Math.round(min || 0)); return `${String(Math.floor(min / 60)).padStart(2, '0')}:${String(min % 60).padStart(2, '0')}h`; };
const parseH = str => { const m = /^\s*(\d{1,3}):([0-5]\d)\s*h?\s*$/i.exec(str || ''); return m ? (+m[1]) * 60 + (+m[2]) : null; };
const r5 = n => Math.round(n / 5) * 5;
const DIAS = ['Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb', 'Dom'];
const DIAS_LONGOS = ['Segunda', 'Terça', 'Quarta', 'Quinta', 'Sexta', 'Sábado', 'Domingo'];
const MESES = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const INC = { alta: 3, media: 2, baixa: 1 };
const INC_LBL = { alta: 'Alta', media: 'Média', baixa: 'Baixa' };
const STATUS = { afazer: 'A fazer', iniciado: 'Iniciado', revisar: 'Revisar', finalizado: 'Finalizado' };
const COMO = ['Questões', 'Aula', 'Leitura'];
const TIPOS = { conteudo: 'Conteúdo', revisao: 'Revisão espaçada', revisaoGeral: 'Revisão geral', simulado: 'Simulado', revisaoSemanal: 'Revisão semanal', redacao: 'Discursiva' };
const COR_TIPO = { simulado: '#8A857A', revisaoSemanal: '#A8A397', redacao: '#B9A15C' };
const CORES_ANTIGAS = {"#4f46e5": "#6E86A8", "#0e9f9a": "#5F949A", "#d9480f": "#C08A64", "#c2255c": "#A9756F", "#7048e8": "#9A7BA6", "#2b8a3e": "#6B9A84"};
const CONTA_LIMITE = new Set(['conteudo', 'revisaoGeral']); // tipos que contam na regra de disciplinas/dia

function toast(msg, ms = 2600) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('on');
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('on'), ms);
}

/* ================= Estado ================= */
let S; // estado completo
const UI = { aba: 'plan', semana: null, vista: 'dias', calMes: null, calOpen: false, editReg: null, aberto: null, metasOpen: false };

function dadosIniciais() { return JSON.parse($('#dados-iniciais').textContent); }

function carregar() {
  let salvo = null;
  try { salvo = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null'); } catch (e) { salvo = null; }
  const base = dadosIniciais();
  if (salvo && salvo.config && salvo.materias && !(salvo.config.exemplo && !base.config.exemplo)) { S = salvo; }
  else if (salvo && salvo.config) { // trocou os dados de exemplo pelo plano real
    S = base; S.cards = []; S.registros = []; gerarCronograma(); S.meta.sincEm = salvo.meta?.sincEm || 0; S.meta.atualizadoEm = Date.now();
    S.pomo = salvo.pomo; setTimeout(() => toast('Plano atualizado para o seu concurso.', 4000), 400);
  }
  else { S = dadosIniciais(); S.cards = []; S.registros = []; gerarCronograma(); }
  S.cards ||= []; S.registros ||= []; S.meta ||= {};
  S.materias.forEach(m => { if (CORES_ANTIGAS[m.cor]) m.cor = CORES_ANTIGAS[m.cor]; });
  try { const ui = JSON.parse(localStorage.getItem(STORAGE_KEY + '-ui') || '{}'); if (ui.aba) UI.aba = ui.aba; if (ui.vista) UI.vista = ui.vista; } catch (e) {}
}
function salvar(editou = true) {
  if (editou) { S.meta ||= {}; S.meta.atualizadoEm = Date.now(); }
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(S)); } catch (e) { toast('Não foi possível salvar no navegador. Exporte um backup.'); }
  salvarUI();
  if (editou) agendarEnvio();
}
function salvarUI() { try { localStorage.setItem(STORAGE_KEY + '-ui', JSON.stringify({ aba: UI.aba, vista: UI.vista })); } catch (e) {} }

/* ================= Datas do plano ================= */
const inicioSeg = () => monday(pd(S.config.inicio));
function numSemanas() {
  const c = S.config;
  if (c.prova) return Math.max(1, Math.ceil((diffDias(inicioSeg(), pd(c.prova)) + 1) / 7));
  return Math.max(1, +c.semanas || 1);
}
const semanaDe = dt => Math.floor(diffDias(inicioSeg(), pd(dt)) / 7);
const diaDe = dt => (pd(dt).getDay() + 6) % 7;
const dataDe = (w, d) => iso(addD(inicioSeg(), w * 7 + d));
const semanaRevisao = w => numSemanas() >= 2 && w === numSemanas() - 1;
function ultimoDiaPlano() {
  const fim = addD(inicioSeg(), numSemanas() * 7 - 1);
  if (S.config.prova) { const p = addD(pd(S.config.prova), -1); return iso(p < fim ? p : fim); }
  return iso(fim);
}

/* ================= Lookups ================= */
const mat = id => S.materias.find(m => m.id === id);
function assunto(id) { for (const m of S.materias) { const a = m.assuntos.find(a => a.id === id); if (a) return { a, m }; } return null; }
const proibido = (a, b) => (S.config.paresProibidos || []).some(([x, y]) => (x === a && y === b) || (x === b && y === a));
const relev = m => (+m.questoes || 1) * (+m.peso || 1) * (INC[m.incidencia] || 1);

/* ================= Ciclo (peso × incidência) ================= */
function minutosConteudoSemana() {
  const c = S.config;
  return Math.max(0, c.horasDia * 60 * 6 - (c.discursiva ? (+c.redacaoMin || 0) : 0));
}
function ciclo() {
  const total = minutosConteudoSemana();
  const soma = S.materias.reduce((s, m) => s + relev(m), 0) || 1;
  return S.materias.map(m => ({ m, rel: relev(m), pct: relev(m) / soma, min: r5(total * relev(m) / soma) }));
}

/* Distribui as matérias pelos dias (seg–sáb) respeitando o limite/dia e os pares proibidos */
function atribuirDias(cic, extraSabado, disponiveis) {
  const max = +S.config.maxDisciplinasDia || 3;
  const dias = Array.from({ length: 6 }, (_, i) => ({ mats: [], load: i === 5 ? extraSabado : 0, ok: disponiveis.includes(i) }));
  const nDisp = disponiveis.length;
  const itens = cic.filter(x => x.min > 0).map(x => ({ ...x, n: Math.min(nDisp, Math.max(1, Math.round(x.min / 90))) }));
  let tot = itens.reduce((s, x) => s + x.n, 0);
  while (tot > nDisp * max) { const big = itens.filter(x => x.n > 1).sort((a, b) => b.n - a.n)[0]; if (!big) break; big.n--; tot--; }
  itens.sort((a, b) => b.min - a.min);
  const mapa = {};
  for (const it of itens) {
    const escolhidos = [];
    for (let k = 0; k < it.n; k++) {
      const cand = dias.map((d, i) => ({ d, i })).filter(({ d, i }) => d.ok && !escolhidos.includes(i) && d.mats.length < max && !d.mats.some(m => proibido(m, it.m.id)));
      if (!cand.length) break;
      const pen = i => escolhidos.some(j => Math.abs(j - i) === 1) ? 45 : 0;
      cand.sort((a, b) => (a.d.load + pen(a.i)) - (b.d.load + pen(b.i)) || a.i - b.i);
      escolhidos.push(cand[0].i);
    }
    if (!escolhidos.length) { // sem dia válido: usa o menos carregado (o app sinaliza o conflito)
      const i = dias.map((d, i) => i).filter(i => dias[i].ok).sort((a, b) => dias[a].load - dias[b].load)[0];
      if (i === undefined) continue; escolhidos.push(i);
    }
    const porDia = it.min / escolhidos.length;
    escolhidos.forEach(i => { dias[i].mats.push(it.m.id); dias[i].load += porDia; });
    mapa[it.m.id] = escolhidos.sort((a, b) => a - b);
  }
  return mapa;
}

/* ================= Geração do cronograma ================= */
function novoCard(o) {
  return Object.assign({ id: uid(), tipo: 'conteudo', status: 'afazer', como: 'Questões', minutos: 30, auto: true }, o);
}
function gerarCronograma() {
  const c = S.config, W = numSemanas(), temRev = W >= 2, wConteudo = temRev ? W - 1 : W;
  const cic = ciclo(), ini = pd(c.inicio), prova = c.prova ? pd(c.prova) : null;
  const cards = [];
  const disp = w => [0, 1, 2, 3, 4, 5].filter(d => { const dt = addD(inicioSeg(), w * 7 + d); return dt >= ini && (!prova || dt < prova); });

  const semanas = [];
  for (let w = 0; w < wConteudo; w++) {
    const dd = disp(w); if (!dd.length) continue;
    const sab = dd.includes(5) && c.discursiva ? (+c.redacaoMin || 0) : 0;
    semanas.push({ w, dd, fator: dd.length / 6, mapa: atribuirDias(cic, sab, dd) });
  }

  for (const m of S.materias) {
    const x = cic.find(k => k.m.id === m.id);
    if (!m.assuntos.length || !x.min) continue;
    const total = semanas.reduce((s, sw) => s + (sw.mapa[m.id] ? x.min * sw.fator : 0), 0);
    const pesos = m.assuntos.map(a => INC[a.incidencia] || 1), sp = pesos.reduce((a, b) => a + b, 0);
    const fila = m.assuntos.map((a, i) => ({ a, rest: total * pesos[i] / sp }));
    const cobertos = new Set(); let ultimo = null;
    for (const sw of semanas) {
      const dias = sw.mapa[m.id] || []; if (!dias.length) continue;
      const porDia = x.min * sw.fator / dias.length;
      for (const d of dias) {
        let cap = porDia; const dt = dataDe(sw.w, d);
        while (cap > 0.01 && fila.length) {
          const f = fila[0], take = Math.min(cap, f.rest), min = r5(take);
          if (ultimo && ultimo.assuntoId === f.a.id && ultimo.data === dt) ultimo.minutos += min;
          else if (min >= 5) { ultimo = novoCard({ materiaId: m.id, assuntoId: f.a.id, titulo: f.a.nome, data: dt, minutos: min }); cards.push(ultimo); cobertos.add(f.a.id); }
          f.rest -= take; cap -= take; if (f.rest < 0.01) fila.shift();
        }
      }
    }
    // Garantia de cobertura: nenhum assunto fica de fora
    m.assuntos.filter(a => !cobertos.has(a.id)).forEach(a => {
      const dt = ultimo ? ultimo.data : dataDe(0, 0);
      cards.push(novoCard({ materiaId: m.id, assuntoId: a.id, titulo: a.nome, data: dt, minutos: 15 }));
    });
  }
  // Numera partes de assuntos divididos em vários blocos
  const porAss = {};
  cards.forEach(k => (porAss[k.assuntoId] ||= []).push(k));
  Object.values(porAss).forEach(l => { if (l.length > 1) { l.sort((a, b) => a.data.localeCompare(b.data)); l.forEach((k, i) => k.titulo += ` (${i + 1}/${l.length})`); } });

  // Redação (sábado) e domingo (simulado + revisão)
  for (const sw of semanas) {
    if (c.discursiva && sw.dd.includes(5)) cards.push(novoCard({ tipo: 'redacao', titulo: c.discursivaTitulo || 'Redação — produção e correção de texto', data: dataDe(sw.w, 5), minutos: +c.redacaoMin || 60, como: 'Leitura' }));
    const dom = addD(inicioSeg(), sw.w * 7 + 6);
    if (!prova || dom < prova) {
      const h = c.horasDia * 60;
      cards.push(novoCard({ tipo: 'simulado', titulo: 'Simulado semanal', data: iso(dom), minutos: r5(h * 0.6) }));
      cards.push(novoCard({ tipo: 'revisaoSemanal', titulo: 'Revisão da semana + correção do simulado', data: iso(dom), minutos: r5(h * 0.4), como: 'Leitura' }));
    }
  }
  // Última semana: 100% revisão
  if (temRev) {
    const w = W - 1, dd = disp(w);
    if (dd.length) {
      const totalRev = c.horasDia * 60 * dd.length, soma = cic.reduce((s, x) => s + x.rel, 0) || 1;
      const cicRev = cic.map(x => ({ ...x, min: r5(totalRev * x.rel / soma) }));
      const mapa = atribuirDias(cicRev, 0, dd);
      for (const x of cicRev) {
        const dias = mapa[x.m.id] || []; if (!dias.length) continue;
        dias.forEach(d => cards.push(novoCard({ tipo: 'revisaoGeral', materiaId: x.m.id, titulo: `Revisão geral — ${x.m.nome}`, data: dataDe(w, d), minutos: r5(x.min / dias.length), como: 'Questões' })));
      }
      const dom = addD(inicioSeg(), w * 7 + 6);
      if (!prova || dom < prova) cards.push(novoCard({ tipo: 'simulado', titulo: 'Simulado final + revisão dos erros', data: iso(dom), minutos: c.horasDia * 60 }));
    }
  }
  // Mantém tópicos criados manualmente
  S.cards = (S.cards || []).filter(k => !k.auto).concat(cards);
  S.meta = { semanasGeradas: W, horasGeradas: c.horasDia, geradoEm: hoje() };
}

/* Ao mudar horas/dia: recalcula o ciclo e reescala os blocos ainda não finalizados */
function mudarHoras(novo) {
  novo = Math.max(0.5, Math.min(16, +novo || 0));
  const antigo = S.config.horasDia; if (!novo || novo === antigo) return;
  const f = novo / antigo;
  S.cards.forEach(k => { if (k.auto && k.status !== 'finalizado' && k.tipo !== 'redacao' && k.tipo !== 'revisao') k.minutos = Math.max(5, r5(k.minutos * f)); });
  S.config.horasDia = novo; S.meta.horasGeradas = novo;
  salvar(); render(); toast(`Carga ajustada para ${novo}h/dia — ciclo recalculado.`);
}

/* ================= Status e revisão espaçada ================= */
function setStatus(card, st) {
  const prev = card.status; if (prev === st) return;
  card.status = st;
  if (st === 'finalizado') {
    card.finalizadoEm = hoje();
    if (card.materiaId && card.tipo === 'conteudo') criarRevisoes(card);
  } else if (prev === 'finalizado') {
    delete card.finalizadoEm;
    S.cards = S.cards.filter(k => !(k.tipo === 'revisao' && k.origemId === card.id && k.status === 'afazer'));
  }
  salvar();
}
function criarRevisoes(card) {
  const lim = ultimoDiaPlano();
  const dias = S.config.revisoesDias || [1, 7, 30];
  const base = assunto(card.assuntoId)?.a.nome || card.titulo.replace(/ \(\d+\/\d+\)$/, '');
  dias.forEach((n, i) => {
    let dt = iso(addD(new Date(), n)); if (dt > lim) dt = lim; if (dt < S.config.inicio) dt = S.config.inicio;
    S.cards.push(novoCard({ tipo: 'revisao', auto: true, origemId: card.id, materiaId: card.materiaId, assuntoId: card.assuntoId,
      titulo: `Revisão ${n}d — ${base}`, data: dt, minutos: i === 0 ? 20 : 15, como: 'Questões' }));
  });
  toast(`Revisões criadas para ${dias.map(d => d + 'd').join(', ')}.`);
}

/* ================= Regras por dia ================= */
function materiasDoDia(dt, excluirId) {
  return [...new Set(S.cards.filter(k => k.data === dt && k.id !== excluirId && k.materiaId && CONTA_LIMITE.has(k.tipo)).map(k => k.materiaId))];
}
function violacoes(mats) {
  const out = [], max = +S.config.maxDisciplinasDia || 3;
  if (mats.length > max) out.push(`${mats.length} disciplinas no dia (máximo ${max})`);
  for (let i = 0; i < mats.length; i++) for (let j = i + 1; j < mats.length; j++)
    if (proibido(mats[i], mats[j])) out.push(`${mat(mats[i])?.nome} × ${mat(mats[j])?.nome} no mesmo dia`);
  return out;
}
function checarMover(card, dt) {
  if (!card.materiaId || !CONTA_LIMITE.has(card.tipo)) return [];
  const mats = materiasDoDia(dt, card.id); if (!mats.includes(card.materiaId)) mats.push(card.materiaId);
  return violacoes(mats);
}

/* ================= Derivados ================= */
function statusAssunto(aid) {
  const l = S.cards.filter(k => k.assuntoId === aid && k.tipo === 'conteudo');
  if (!l.length) return 'nao';
  if (l.every(k => k.status === 'finalizado')) return 'finalizado';
  if (l.some(k => k.status === 'revisar')) return 'revisar';
  if (l.some(k => k.status !== 'afazer')) return 'iniciado';
  return 'afazer';
}
const cardsSemana = w => S.cards.filter(k => semanaDe(k.data) === w);
const topicos = l => l.filter(k => k.tipo === 'conteudo' || k.tipo === 'revisaoGeral');
const pctFin = l => l.length ? Math.round(100 * l.filter(k => k.status === 'finalizado').length / l.length) : 0;
const regsSemana = w => S.registros.filter(r => semanaDe(r.data) === w);
function acertos(q, e) { q = +q || 0; e = +e || 0; return q ? Math.round(1000 * (q - e) / q) / 10 : null; }
function pctHtml(p) { if (p === null) return '<span class="muted">—</span>'; const cl = p < 70 ? 'r' : p <= 80 ? 'y' : 'g'; return `<span class="pct ${cl}">${String(p).replace('.', ',')}%</span>`; }

/* ================= Render: formatos curtos ================= */
const hm = min => { min = Math.max(0, Math.round(min || 0)); const h = Math.floor(min / 60), m = min % 60; return h ? `${h}h${m ? String(m).padStart(2, '0') : ''}` : `${m}min`; };
const MESES_C = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
const dataLonga = s => { const d = pd(s); return `${d.getDate()} ${MESES_C[d.getMonth()]}`; };
const corDe = k => { const m = mat(k.materiaId); return m ? m.cor : (COR_TIPO[k.tipo] || '#9C978C'); };

/* ================= Render: topo ================= */

function renderCal() {

}

/* ================= Render: abas ================= */
const ABAS = [['plan', 'Planejamento semanal'], ['ciclo', 'Ciclos de estudo'], ['mat', 'Matérias'], ['stats', 'Estatísticas'], ['tempo', 'Tempo de estudos']];
function renderAbas() { $('#abas').innerHTML = ABAS.map(([k, n]) => `<button class="tab ${UI.aba === k ? 'on' : ''}" data-aba="${k}">${n}</button>`).join(''); }

/* ---------- Card ---------- */
function cardHtml(k, mostrarDia) {

  const inc = ass ? ass.a.incidencia : (m ? m.incidencia : null);

  if (inc) partes.push(`<span class="tag-inc inc inc-${inc}">${INC_LBL[inc]}</span>`);
  partes.push(`<span>${hm(k.minutos)}</span>`);
  if (mostrarDia) partes.push(`<span>${DIAS[diaDe(k.data)].toLowerCase()} ${fmtCurto(k.data)}</span>`);
  if (!mostrarDia && (k.status === 'iniciado' || k.status === 'revisar')) partes.push(`<span class="st st-${k.status}">${STATUS[k.status]}</span>`);
  return `<div class="card ${fin ? 'fin' : ''}" draggable="true" data-id="${k.id}">

      ${k.materiaId ? `<button class="ico" data-pomo-card="${k.id}" title="Estudar com pomodoro" aria-label="Estudar com pomodoro">▸</button>` : ''}

      <button class="ico danger" data-del="${k.id}" title="Excluir" aria-label="Excluir">×</button>
    </span></div></div>
  </div>`;
}
const ORDEM_TIPO = { revisao: 0, conteudo: 1, revisaoGeral: 1, redacao: 2, simulado: 3, revisaoSemanal: 4 };
const ordenar = l => l.sort((a, b) => (ORDEM_TIPO[a.tipo] - ORDEM_TIPO[b.tipo]) || (S.materias.indexOf(mat(a.materiaId)) - S.materias.indexOf(mat(b.materiaId))));

/* ---------- Planejamento ---------- */
function diaAberto(dt, w) {
  if (UI.aberto && semanaDe(UI.aberto) === w) return UI.aberto === dt;
  if (UI.aberto === '') return false;
  const t = hoje(); return semanaDe(t) === w ? dt === t : dt === dataDe(w, 0);
}

      <button class="btn" data-add="${w === atual ? hoje() : dataDe(w, 0)}">+ Tópico</button>

      const aberto = diaAberto(dt, w), feitos = doDia.filter(k => k.status === 'finalizado').length;

        ${aberto ? `<div class="dia-corpo"><div class="cards">${doDia.map(k => cardHtml(k)).join('')}</div><button class="add" data-add="${dt}">+ adicionar tópico neste dia</button></div>` : ''}
      </section>`;
    }
    h += `</div>`;
  } else {
    h += `<div class="kanban">`;
    for (const st of Object.keys(STATUS)) {

    }
    h += `</div>`;
  }
  return h + metasSemana(w, lista);
}
function metasSemana(w, lista) {
  const regs = regsSemana(w);
  const linhas = S.materias.map(m => {
    const l = lista.filter(k => k.materiaId === m.id && k.tipo !== 'revisao');
    const plan = l.reduce((s, k) => s + k.minutos, 0); if (!plan) return '';
    const diasN = new Set(l.map(k => diaDe(k.data))).size;
    const feito = regs.filter(r => r.materiaId === m.id).reduce((s, r) => s + r.minutos, 0);
    const tp = topicos(l), fin = tp.filter(k => k.status === 'finalizado').length;
    const p = Math.min(100, Math.round(100 * feito / plan));
    return `<tr><td><span class="mdot" style="--c:${m.cor}"></span>${esc(m.nome)}</td>
      <td class="num">${hm(plan)}</td><td class="num muted">${hm(plan / Math.max(1, diasN))}</td><td class="num">${hm(feito)}</td>
      <td style="width:22%"><div class="bar"><i style="width:${p}%;--c:${m.cor}"></i></div></td><td class="num muted">${fin}/${tp.length}</td></tr>`;
  }).join('');
  return `<details class="bloco metas" ${UI.metasOpen ? 'open' : ''} id="metas"><summary>Metas da semana</summary>
    <div class="tbl-wrap"><table><thead><tr><th>Matéria</th><th class="num">Semana</th><th class="num">Por dia</th><th class="num">Feito</th><th></th><th class="num">Tópicos</th></tr></thead>
    <tbody>${linhas || '<tr><td colspan="6" class="muted">Sem metas nesta semana.</td></tr>'}</tbody></table></div>
    <p class="small faint" style="margin-top:10px">Meta diária: ${hm(S.config.horasDia * 60)}. As horas feitas vêm da aba Tempo de estudos.</p></details>`;
}

/* ---------- Ciclos ---------- */
function renderCiclo() {
  const cic = ciclo(), W = numSemanas(), wC = W >= 2 ? W - 1 : W;
  const mapa = atribuirDias(cic, S.config.discursiva ? +S.config.redacaoMin || 0 : 0, [0, 1, 2, 3, 4, 5]);
  const totalAss = S.materias.reduce((s, m) => s + m.assuntos.length, 0);
  const cob = S.materias.reduce((s, m) => s + m.assuntos.filter(a => S.cards.some(k => k.assuntoId === a.id && k.tipo === 'conteudo')).length, 0);
  let h = `<div class="sec-h"><div><p class="eyebrow">peso × incidência</p><h2>Ciclo semanal</h2>
    <p class="sub">${hm(minutosConteudoSemana())} de conteúdo novo por semana · ${wC} semanas de conteúdo + ${W - wC} de revisão · ${cob} de ${totalAss} assuntos no cronograma</p></div></div>
  <div class="bloco">
    <div class="distrib">${cic.map(x => `<i style="--c:${x.m.cor};flex:${x.pct}" title="${esc(x.m.nome)} ${(x.pct * 100).toFixed(0)}%"></i>`).join('')}</div>
    <div class="tbl-wrap"><table><thead><tr><th>Matéria</th><th class="num">Questões</th><th class="num">Peso</th><th>Incidência</th><th class="num">Ciclo</th><th class="num">Por semana</th><th>Dias</th></tr></thead><tbody>`;
  for (const x of cic) {
    h += `<tr><td><span class="mdot" style="--c:${x.m.cor}"></span>${esc(x.m.nome)}</td><td class="num muted">${x.m.questoes}</td><td class="num muted">${x.m.peso}</td>
      <td><span class="tag-inc inc inc-${x.m.incidencia}">${INC_LBL[x.m.incidencia]}</span></td>
      <td class="num muted">${(x.pct * 100).toFixed(0)}%</td><td class="num"><b style="font-weight:500">${hm(x.min)}</b></td>
      <td class="small muted">${(mapa[x.m.id] || []).map(d => DIAS[d]).join(' · ')}</td></tr>`;
  }
  h += `</tbody></table></div><p class="small faint" style="margin-top:14px">Relevância = questões × peso × incidência (alta 3, média 2, baixa 1). Pares que não caem no mesmo dia: ${(S.config.paresProibidos || []).map(([a, b]) => `${esc(mat(a)?.nome || a)} × ${esc(mat(b)?.nome || b)}`).join('; ') || 'nenhum'}.</p></div>`;

  h += `<div class="bloco"><h3>Assuntos em cada semana</h3><p class="sub">Abra uma matéria para ver a sequência. Verde = finalizado.</p>`;
  for (const m of S.materias) {
    const porSem = {};
    S.cards.filter(k => k.materiaId === m.id && k.tipo === 'conteudo').forEach(k => { const w = semanaDe(k.data); (porSem[w] ||= new Map()).set(k.assuntoId || k.id, k); });
    const linhas = Object.keys(porSem).map(Number).sort((a, b) => a - b).map(w => `<tr><td class="small faint" style="white-space:nowrap;width:60px">Sem. ${w + 1}</td><td><div class="chips">${[...porSem[w].values()].map(k => {
      const nome = k.assuntoId ? assunto(k.assuntoId)?.a.nome || k.titulo : k.titulo;
      return `<span class="chip ${statusAssunto(k.assuntoId) === 'finalizado' || k.status === 'finalizado' ? 'ok' : ''}">${esc(nome)}</span>`; }).join('')}</div></td></tr>`).join('');
    h += `<details style="border-top:1px solid var(--line-2);padding:12px 0"><summary style="cursor:pointer;font-family:var(--f-head);font-weight:500"><span class="mdot" style="--c:${m.cor}"></span>${esc(m.nome)} <span class="faint small" style="font-family:var(--f-body);font-weight:400">· ${m.assuntos.length} assuntos</span></summary>
      <table style="margin-top:8px"><tbody>${linhas || '<tr><td class="muted">Nenhum assunto planejado.</td></tr>'}</tbody></table></details>`;
  }
  return h + `</div>`;
}

/* ---------- Matérias ---------- */

    <div class="row"><button class="btn ghost" data-acao="addMat">+ Matéria</button><button class="btn" data-acao="regerar">Regerar cronograma</button></div></div>`;
  if (S.premissas?.length) h += `<details class="bloco"><summary>Premissas da análise</summary><ul class="muted" style="margin:0;padding-left:18px">${S.premissas.map(p => `<li>${esc(p)}</li>`).join('')}</ul></details>`;
  S.materias.forEach((m, mi) => {

      <label>Incidência <select data-minc="${m.id}">${Object.keys(INC).map(i => `<option value="${i}" ${m.incidencia === i ? 'selected' : ''}>${INC_LBL[i]}</option>`).join('')}</select></label>
      <button class="ico" data-renmat="${m.id}" title="Renomear" aria-label="Renomear">✎</button><button class="ico danger" data-delmat="${m.id}" title="Excluir matéria" aria-label="Excluir matéria">×</button>
    </div>
    <div class="tbl-wrap"><table><tbody>
    ${m.assuntos.map((a, ai) => {
      const st = statusAssunto(a.id), plan = S.cards.filter(k => k.assuntoId === a.id && k.tipo === 'conteudo').reduce((s, k) => s + k.minutos, 0);
      return `<tr><td class="faint small" style="width:44px">${mi + 1}.${ai + 1}</td><td>${esc(a.nome)}</td>
        <td style="width:120px"><select data-ainc="${a.id}" aria-label="Incidência">${Object.keys(INC).map(i => `<option value="${i}" ${a.incidencia === i ? 'selected' : ''}>${INC_LBL[i]}</option>`).join('')}</select></td>
        <td style="width:110px"><span class="st st-${st}">${st === 'nao' ? 'não planejado' : STATUS[st]}</span></td><td class="num muted small" style="width:70px">${hm(plan)}</td>
        <td style="width:70px;white-space:nowrap"><button class="ico" data-renass="${a.id}" title="Renomear" aria-label="Renomear">✎</button><button class="ico danger" data-delass="${a.id}" title="Excluir" aria-label="Excluir">×</button></td></tr>`;
    }).join('')}
    </tbody></table></div><button class="add" data-addass="${m.id}">+ assunto</button></div>`;
  });
  return h;
}

/* ---------- Estatísticas ---------- */
function renderStats() {
  const W = numSemanas(), todos = topicos(S.cards);
  const totPlan = S.cards.reduce((s, k) => s + k.minutos, 0), totReal = S.registros.reduce((s, r) => s + r.minutos, 0);
  const q = S.registros.reduce((s, r) => s + (+r.questoes || 0), 0), e = S.registros.reduce((s, r) => s + (+r.erros || 0), 0);
  const w = Math.min(Math.max(0, semanaDe(hoje())), W - 1);
  const ac = acertos(q, e);
  let h = `<div class="sec-h"><div><p class="eyebrow">atualiza sozinho</p><h2>Estatísticas</h2></div></div>
  <div class="kpis">
    <div class="kpi"><span class="num-big">${pctFin(todos)}%</span><span>do plano finalizado</span></div>
    <div class="kpi"><span class="num-big">${pctFin(topicos(cardsSemana(w)))}%</span><span>da semana ${w + 1}</span></div>
    <div class="kpi"><span class="num-big">${hm(totReal)}</span><span>estudadas de ${hm(totPlan)}</span></div>
    <div class="kpi"><span class="num-big">${ac === null ? '—' : String(ac).replace('.', ',') + '%'}</span><span>de acertos em ${q} questões</span></div>
  </div>`;
  const barra = (nome, cor, p, v) => `<div class="barrow"><div>${cor ? `<span class="mdot" style="--c:${cor}"></span>` : ''}${esc(nome)}</div><div class="bar"><i style="width:${Math.min(100, p)}%;--c:${cor || 'var(--ink)'}"></i></div><div class="v">${v}</div></div>`;
  const dupla = (nome, cor, plan, real, max) => `<div class="barrow"><div>${cor ? `<span class="mdot" style="--c:${cor}"></span>` : ''}${esc(nome)}</div>
    <div class="bar" style="--c:${cor || 'var(--ink)'}"><i class="plan" style="width:${100 * plan / max}%"></i><i style="width:${Math.min(100, 100 * real / max)}%"></i></div><div class="v">${hm(real)} / ${hm(plan)}</div></div>`;
  const nf = l => l.filter(k => k.status === 'finalizado').length;

  h += `<div class="bloco"><h3>Progresso por matéria</h3><p class="sub">% de tópicos finalizados</p><div class="barras">`;
  S.materias.forEach(m => { const l = todos.filter(k => k.materiaId === m.id); h += barra(m.nome, m.cor, pctFin(l), `${pctFin(l)}% · ${nf(l)}/${l.length}`); });
  h += `</div></div><div class="bloco"><h3>Horas estudadas × planejadas</h3><p class="sub">Trilho claro: planejado · trilho cheio: estudado</p><div class="barras">`;
  const pm = S.materias.map(m => ({ m, plan: S.cards.filter(k => k.materiaId === m.id).reduce((s, k) => s + k.minutos, 0), real: S.registros.filter(r => r.materiaId === m.id).reduce((s, r) => s + r.minutos, 0) }));
  const maxM = Math.max(1, ...pm.map(x => Math.max(x.plan, x.real)));
  pm.forEach(x => h += dupla(x.m.nome, x.m.cor, x.plan, x.real, maxM));
  h += `</div></div><details class="bloco"><summary>Semana a semana</summary><div class="barras">`;
  const ps = Array.from({ length: W }, (_, i) => ({ i, l: topicos(cardsSemana(i)), plan: cardsSemana(i).reduce((s, k) => s + k.minutos, 0), real: regsSemana(i).reduce((s, r) => s + r.minutos, 0) }));
  const maxS = Math.max(1, ...ps.map(x => Math.max(x.plan, x.real)));
  ps.forEach(x => { const cor = x.i === w ? 'var(--accent)' : null; h += barra(`Semana ${x.i + 1}${semanaRevisao(x.i) ? ' · revisão' : ''}`, cor, pctFin(x.l), `${pctFin(x.l)}% · ${nf(x.l)}/${x.l.length}`) + dupla('horas', cor, x.plan, x.real, maxS); });
  h += `</div></details><div class="bloco"><h3>Questões por matéria</h3><div class="tbl-wrap"><table><thead><tr><th>Matéria</th><th class="num">Questões</th><th class="num">Erros</th><th class="num">Acertos</th></tr></thead><tbody>`;
  S.materias.forEach(m => { const l = S.registros.filter(r => r.materiaId === m.id); const q = l.reduce((s, r) => s + (+r.questoes || 0), 0), e = l.reduce((s, r) => s + (+r.erros || 0), 0);
    h += `<tr><td><span class="mdot" style="--c:${m.cor}"></span>${esc(m.nome)}</td><td class="num muted">${q}</td><td class="num muted">${e}</td><td class="num">${pctHtml(acertos(q, e))}</td></tr>`; });
  return h + `</tbody></table></div></div>`;
}

/* ---------- Tempo de estudos ---------- */
function opcoesMat(sel) { return S.materias.map(m => `<option value="${m.id}" ${m.id === sel ? 'selected' : ''}>${esc(m.nome)}</option>`).join(''); }
function opcoesAss(mid, sel) { const m = mat(mid); return `<option value="">Geral da matéria</option>` + (m ? m.assuntos.map(a => `<option value="${a.id}" ${a.id === sel ? 'selected' : ''}>${esc(a.nome)}</option>`).join('') : ''); }
function renderTempo() {
  const r = UI.editReg ? S.registros.find(x => x.id === UI.editReg) : null;
  const mid = r ? r.materiaId : S.materias[0]?.id;
  let h = `<div class="sec-h"><div><p class="eyebrow">registro diário</p><h2>Tempo de estudos</h2></div></div>
  <div class="bloco"><h3>${r ? 'Editar registro' : 'Registrar estudo'}</h3><p class="sub">Acertos = (questões − erros) ÷ questões · <span class="pct r">abaixo de 70%</span> <span class="pct y">70 a 80%</span> <span class="pct g">acima de 80%</span></p>
    <form id="formReg" class="form-grid">
      <label>Data <input type="date" name="data" required value="${r ? r.data : hoje()}"></label>
      <label>Disciplina <select name="materiaId" id="regMat" required>${opcoesMat(mid)}</select></label>
      <label style="grid-column:span 2">Assunto <select name="assuntoId" id="regAss">${opcoesAss(mid, r?.assuntoId)}</select></label>
      <label>Horas (00:00h) <input name="horas" required placeholder="01:30h" value="${r ? fmtH(r.minutos) : ''}"></label>
      <label>Questões <input type="number" name="questoes" min="0" value="${r ? r.questoes : 0}"></label>
      <label>Erros <input type="number" name="erros" min="0" value="${r ? r.erros : 0}"></label>
      <label>Acertos <span id="prevPct" style="padding:8px 0">${pctHtml(r ? acertos(r.questoes, r.erros) : null)}</span></label>
      <div class="row" style="grid-column:1/-1"><button class="btn pri" type="submit">${r ? 'Salvar alterações' : 'Registrar'}</button>${r ? '<button class="btn ghost" type="button" data-acao="cancelReg">Cancelar</button>' : ''}</div>
    </form></div>`;
  const l = [...S.registros].sort((a, b) => b.data.localeCompare(a.data) || (b.criado || 0) - (a.criado || 0));
  h += `<div class="bloco"><h3>Histórico</h3>${l.length ? '' : '<p class="sub" style="margin:6px 0 0">Seus registros aparecem aqui.</p>'}${l.length ? `<div class="tbl-wrap"><table><thead><tr><th>Data</th><th>Disciplina</th><th>Assunto</th><th class="num">Horas</th><th class="num">Questões</th><th class="num">Erros</th><th class="num">Acertos</th><th></th></tr></thead><tbody>
    ${l.map(x => { const m = mat(x.materiaId); return `<tr><td class="muted">${fmtBR(x.data)}</td><td>${m ? `<span class="mdot" style="--c:${m.cor}"></span>${esc(m.nome)}` : '—'}</td>
      <td class="small muted">${esc(x.assuntoId ? assunto(x.assuntoId)?.a.nome || '—' : '—')}</td><td class="num">${fmtH(x.minutos)}</td><td class="num muted">${x.questoes}</td><td class="num muted">${x.erros}</td>
      <td class="num">${pctHtml(acertos(x.questoes, x.erros))}</td><td style="white-space:nowrap;width:70px"><button class="ico" data-editreg="${x.id}" title="Editar" aria-label="Editar">✎</button><button class="ico danger" data-delreg="${x.id}" title="Excluir" aria-label="Excluir">×</button></td></tr>`; }).join('')}
    </tbody></table></div>` : ''}</div>`;
  return h;
}
function montarTempo() {
  const f = $('#formReg'); if (!f) return;
  $('#regMat').onchange = e => { $('#regAss').innerHTML = opcoesAss(e.target.value); };
  const prev = () => { $('#prevPct').innerHTML = pctHtml(acertos(f.questoes.value, f.erros.value)); };
  f.questoes.oninput = prev; f.erros.oninput = prev;
  f.onsubmit = ev => {
    ev.preventDefault();
    const min = parseH(f.horas.value), q = +f.questoes.value || 0, e = +f.erros.value || 0;
    if (min === null) return toast('Use o formato 00:00h (ex.: 01:30h).');
    if (e > q) return toast('Erros não pode passar do total de questões.');
    const dados = { data: f.data.value, materiaId: f.materiaId.value, assuntoId: f.assuntoId.value || null, minutos: min, questoes: q, erros: e };
    if (UI.editReg) { Object.assign(S.registros.find(x => x.id === UI.editReg), dados); UI.editReg = null; toast('Registro atualizado.'); }
    else { S.registros.push({ id: uid(), criado: Date.now(), ...dados }); toast('Registro salvo.'); }
    salvar(); render();
  };
}

function abrirModal(html) { $('#modalBody').innerHTML = html; $('#modal').showModal(); }

function confirmar(msg) { return window.confirm(msg); }

function modalCard(card, dataPadrao) {
  const k = card || { materiaId: S.materias[0]?.id, assuntoId: '', titulo: '', data: dataPadrao || hoje(), minutos: 60, status: 'afazer', como: 'Questões', tipo: 'conteudo' };
  abrirModal(`<h2>${card ? 'Editar tópico' : 'Novo tópico'}</h2>
    <form id="formCard" class="form-grid">
      <label>Matéria <select name="materiaId" id="cMat"><option value="">Nenhuma</option>${opcoesMat(k.materiaId)}</select></label>
      <label>Tipo <select name="tipo">${Object.entries(TIPOS).map(([v, n]) => `<option value="${v}" ${k.tipo === v ? 'selected' : ''}>${n}</option>`).join('')}</select></label>
      <label class="full">Assunto <select name="assuntoId" id="cAss">${opcoesAss(k.materiaId, k.assuntoId)}</select></label>
      <label class="full">Título <input name="titulo" value="${esc(k.titulo)}" placeholder="Vazio = nome do assunto"></label>
      <label>Data <input type="date" name="data" required value="${k.data}"></label>
      <label>Duração (00:00h) <input name="horas" required value="${fmtH(k.minutos)}"></label>
      <label>Status <select name="status">${Object.entries(STATUS).map(([v, n]) => `<option value="${v}" ${k.status === v ? 'selected' : ''}>${n}</option>`).join('')}</select></label>
      <label>Como concluir <select name="como">${COMO.map(o => `<option ${k.como === o ? 'selected' : ''}>${o}</option>`).join('')}</select></label>
      <label class="full">Anotações <textarea name="notas" rows="2">${esc(k.notas || '')}</textarea></label>
    </form>
    <div class="modal-f"><button class="btn ghost" data-acao="fechar">Cancelar</button><button class="btn pri" id="salvarCard">Salvar</button></div>`);
  const f = $('#formCard');
  $('#cMat').onchange = e => { $('#cAss').innerHTML = opcoesAss(e.target.value); };
  $('#salvarCard').onclick = () => {
    const min = parseH(f.horas.value); if (min === null) return toast('Use o formato 00:00h (ex.: 01:00h).');
    const aid = f.assuntoId.value || null, mid = f.materiaId.value || null;
    const titulo = f.titulo.value.trim() || (aid ? assunto(aid).a.nome : (mid ? mat(mid).nome : TIPOS[f.tipo.value]));
    const novo = { tipo: f.tipo.value, materiaId: mid, assuntoId: aid, titulo, data: f.data.value, minutos: min, como: f.como.value, notas: f.notas.value };
    const alvo = card || novoCard({ auto: false, ...novo });
    const v = checarMover({ ...alvo, ...novo }, novo.data);
    if (v.length && (!card || card.data !== novo.data || card.materiaId !== mid) && !confirmar(`Atenção:\n• ${v.join('\n• ')}\n\nSalvar mesmo assim?`)) return;
    if (card) Object.assign(card, novo); else S.cards.push(alvo);
    setStatus(alvo, f.status.value);
    UI.aberto = novo.data;
    salvar(); fecharModal(); render(); toast(card ? 'Tópico atualizado.' : 'Tópico adicionado.');
  };
}

/* ================= Backup ================= */
function exportar() {
  const blob = new Blob([JSON.stringify(S, null, 2)], { type: 'application/json' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
  a.download = `backup-estudos-${hoje()}.json`; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  toast('Backup exportado.');
}
function importar(file) {
  const r = new FileReader();
  r.onload = () => {
    try {
      const d = JSON.parse(r.result);
      if (!d.config || !Array.isArray(d.materias)) throw new Error('formato');
      if (!confirmar('Substituir todos os dados atuais pelo backup?')) return;
      S = d; S.cards ||= []; S.registros ||= []; S.meta ||= {};
      if (!S.cards.length) gerarCronograma();
      UI.semana = null; salvar(); fecharModal(); render(); toast('Backup importado.');
    } catch (e) { toast('Arquivo inválido: use um JSON exportado pelo app.'); }
  };
  r.readAsText(file);
}

/* ================= Pomodoro ================= */
const POMO_KEY = STORAGE_KEY + '-pomo';
const FASES_P = { foco: 'Foco', curta: 'Pausa', longa: 'Pausa longa' };
const COR_FASE = { foco: 'var(--accent)', curta: 'var(--ok)', longa: 'var(--ok)' };
const TITULO_BASE = document.title;
const RAIO = 70, CIRC = 2 * Math.PI * RAIO;
let P = { fase: 'foco', rodando: false, fim: null, restante: null, feitos: 0, materiaId: null, assuntoId: null, cardId: null, aberto: false };
let audioCtx = null;
const cfgP = () => (S.pomo ||= { foco: 25, curta: 5, longa: 15, ciclos: 4, auto: true });
const durFase = f => Math.max(1, +cfgP()[f] || 1) * 60;
const mmss = s => `${String(Math.floor(s / 60)).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`;
function salvarP() { try { localStorage.setItem(POMO_KEY, JSON.stringify(P)); } catch (e) {} }
function carregarP() {
  try { const x = JSON.parse(localStorage.getItem(POMO_KEY) || 'null'); if (x) Object.assign(P, x); } catch (e) {}
  if (P.restante == null) P.restante = durFase(P.fase);
}
const restanteAgora = () => P.rodando ? Math.max(0, Math.ceil((P.fim - Date.now()) / 1000)) : P.restante;

function garantirAudio() {
  try { audioCtx ||= new (window.AudioContext || window.webkitAudioContext)(); if (audioCtx.state === 'suspended') audioCtx.resume(); } catch (e) {}
}
function sino() { // dois toques suaves
  if (!audioCtx) return;
  try {
    [[660, 0], [880, .28]].forEach(([f, t]) => {
      const o = audioCtx.createOscillator(), g = audioCtx.createGain(), t0 = audioCtx.currentTime + t;
      o.type = 'sine'; o.frequency.value = f; g.gain.setValueAtTime(0, t0);
      g.gain.linearRampToValueAtTime(.18, t0 + .02); g.gain.exponentialRampToValueAtTime(.0001, t0 + 1.1);
      o.connect(g).connect(audioCtx.destination); o.start(t0); o.stop(t0 + 1.2);
    });
  } catch (e) {}
}

function pomoIniciar() { if (P.rodando) return; garantirAudio(); P.fim = Date.now() + restanteAgora() * 1000; P.rodando = true; salvarP(); renderPomo(); }
function pomoPausar() { if (!P.rodando) return; P.restante = restanteAgora(); P.rodando = false; P.fim = null; salvarP(); renderPomo(); }
function pomoFase(f) { P.fase = f; P.rodando = false; P.fim = null; P.restante = durFase(f); salvarP(); renderPomo(); }
function concluirFase(completa) {
  const eraFoco = P.fase === 'foco', ciclos = Math.max(1, +cfgP().ciclos || 4);
  if (eraFoco && completa) { P.feitos++; registrarFoco(Math.round(durFase('foco') / 60)); }
  const prox = eraFoco ? (completa && P.feitos % ciclos === 0 ? 'longa' : 'curta') : 'foco';
  if (completa) { sino(); toast(eraFoco ? `Foco concluído. Hora da ${FASES_P[prox].toLowerCase()}.` : 'Pausa encerrada. Bora voltar?', 4000); }
  pomoFase(prox);
}
function registrarFoco(min) {
  if (!cfgP().auto || !P.materiaId || !mat(P.materiaId)) return;
  const aid = P.assuntoId || null;
  const r = S.registros.find(r => r.pomodoro && r.data === hoje() && r.materiaId === P.materiaId && (r.assuntoId || null) === aid);
  if (r) r.minutos += min;
  else S.registros.push({ id: uid(), criado: Date.now(), data: hoje(), materiaId: P.materiaId, assuntoId: aid, minutos: min, questoes: 0, erros: 0, pomodoro: true });
  const card = P.cardId && S.cards.find(k => k.id === P.cardId);
  if (card && card.status === 'afazer') setStatus(card, 'iniciado');
  salvar();
  if (!$('#modal').open && !(UI.aba === 'tempo' && document.activeElement?.closest('#formReg'))) render();
  setTimeout(() => toast(`+${hm(min)} lançados em ${mat(P.materiaId).nome}.`), 4200);
}

function atualizarRelogio() {
  const r = restanteAgora(), dur = durFase(P.fase);
  const t = $('#pTempo'), pill = $('#pPill'), ring = $('#pRing');
  if (t) t.textContent = mmss(r);
  if (pill) pill.textContent = mmss(r);
  if (ring) ring.style.strokeDashoffset = (CIRC * (1 - r / dur)).toFixed(1);
  document.title = P.rodando ? `${mmss(r)} · ${FASES_P[P.fase]} — ${TITULO_BASE}` : TITULO_BASE;
}
function renderPomo() {
  const c = cfgP(), ciclos = Math.max(1, +c.ciclos || 4), r = restanteAgora();
  const nFoco = (P.feitos % ciclos) + 1;
  const lbl = P.fase === 'foco' ? (P.materiaId && mat(P.materiaId) ? mat(P.materiaId).nome : 'foco') : FASES_P[P.fase].toLowerCase();
  let h = '';
  if (P.aberto) {
    h += `<div class="pomo-panel" role="dialog" aria-label="Pomodoro" style="--pc:${COR_FASE[P.fase]}">
      <div class="pp-h"><span class="eyebrow">Pomodoro · ${P.fase === 'foco' ? `foco ${nFoco} de ${ciclos}` : `${P.feitos} ${P.feitos === 1 ? 'foco feito' : 'focos feitos'}`}</span><button class="ico" data-pomo="toggle" aria-label="Fechar">×</button></div>
      <div class="seg pp-fases">${Object.entries(FASES_P).map(([k, n]) => `<button data-pomo-fase="${k}" class="${P.fase === k ? 'on' : ''}">${n}</button>`).join('')}</div>
      <div class="pp-ring"><svg viewBox="0 0 160 160"><circle class="trilho" cx="80" cy="80" r="${RAIO}"/><circle class="prog" id="pRing" cx="80" cy="80" r="${RAIO}" stroke-dasharray="${CIRC.toFixed(1)}" stroke-dashoffset="${(CIRC * (1 - r / durFase(P.fase))).toFixed(1)}"/></svg>
        <div class="pp-t"><span id="pTempo">${mmss(r)}</span><small>${FASES_P[P.fase]} de ${c[P.fase]} min</small></div></div>
      <div class="pp-ctrl">
        <button class="ico" data-pomo="zerar" title="Recomeçar" aria-label="Recomeçar">↺</button>
        <button class="btn pri" data-pomo="play">${P.rodando ? 'Pausar' : (r < durFase(P.fase) ? 'Continuar' : 'Começar')}</button>
        <button class="ico" data-pomo="pular" title="Pular para a próxima fase" aria-label="Pular">⇥</button>
      </div>
      <div class="pp-campos">
        <select id="pMat" aria-label="Matéria"><option value="">Sem matéria</option>${opcoesMat(P.materiaId)}</select>
        ${P.materiaId ? `<select id="pAss" aria-label="Assunto">${opcoesAss(P.materiaId, P.assuntoId)}</select>` : ''}
        <label class="pp-chk"><input type="checkbox" id="pAuto" ${c.auto ? 'checked' : ''}> Lançar cada foco no Tempo de estudos</label>
      </div>
      <details><summary>Ajustar tempos ›</summary><div class="pp-cfg">
        <label>Foco (min)<input type="number" min="1" max="120" data-pcfg="foco" value="${c.foco}"></label>
        <label>Pausa (min)<input type="number" min="1" max="60" data-pcfg="curta" value="${c.curta}"></label>
        <label>Pausa longa (min)<input type="number" min="1" max="90" data-pcfg="longa" value="${c.longa}"></label>
        <label>Longa a cada (focos)<input type="number" min="1" max="12" data-pcfg="ciclos" value="${c.ciclos}"></label>
      </div></details>
    </div>`;
  }
  h += `<button class="pomo-pill ${P.rodando ? 'on' : ''}" data-pomo="toggle" style="--pc:${COR_FASE[P.fase]}" aria-label="Pomodoro"><span class="pdot"></span><span id="pPill">${mmss(r)}</span><span class="lbl">${esc(lbl)}</span></button>`;
  $('#pomo').innerHTML = h;
  atualizarRelogio();
}
function pomoCard(id) {
  const k = S.cards.find(k => k.id === id); if (!k) return;
  P.materiaId = k.materiaId || null; P.assuntoId = k.assuntoId || null; P.cardId = k.id; P.aberto = true;
  if (P.fase !== 'foco' && !P.rodando) { P.fase = 'foco'; P.restante = durFase('foco'); }
  salvarP(); pomoIniciar(); toast(`Foco em ${k.titulo}.`);
}
function pomoClique(t) {
  const d = t.dataset;
  if (d.pomoCard) { pomoCard(d.pomoCard); return true; }
  if (d.pomoFase) { if (P.rodando && !confirmar('Trocar de fase interrompe o timer atual. Continuar?')) return true; pomoFase(d.pomoFase); return true; }
  switch (d.pomo) {
    case 'toggle': P.aberto = !P.aberto; salvarP(); renderPomo(); return true;
    case 'play': P.rodando ? pomoPausar() : pomoIniciar(); return true;
    case 'zerar': pomoFase(P.fase); return true;
    case 'pular': concluirFase(false); return true;
  }
  return false;
}
function pomoMudanca(t) {
  if (t.id === 'pMat') { P.materiaId = t.value || null; P.assuntoId = null; P.cardId = null; salvarP(); renderPomo(); return true; }
  if (t.id === 'pAss') { P.assuntoId = t.value || null; P.cardId = null; salvarP(); return true; }
  if (t.id === 'pAuto') { cfgP().auto = t.checked; salvar(); return true; }
  if (t.dataset.pcfg) {
    const k = t.dataset.pcfg; cfgP()[k] = Math.max(1, Math.round(+t.value || 1)); salvar();
    if (!P.rodando && (k === P.fase)) P.restante = durFase(k);
    salvarP(); renderPomo(); const el = $(`[data-pcfg="${k}"]`); el?.closest('details')?.setAttribute('open', ''); return true;
  }
  return false;
}
setInterval(() => { if (!P.rodando) return; if (restanteAgora() <= 0) concluirFase(true); else atualizarRelogio(); }, 500);

/* ================= Sincronização (Supabase) =================
   O app continua salvando no navegador. Com o Supabase configurado e a pessoa logada,
   cada alteração também vai para a tabela estado_estudos (uma linha por usuária).
   Regra de conflito: vale a versão mais nova; se os dois lados mudaram desde o último sync, pergunta. */
const SYNC_KEY = STORAGE_KEY + '-sync';
const SUPABASE_LIB = 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3/dist/umd/supabase.js';
const SY = { cli: null, user: null, estado: 'off', msg: '', timer: null, puxando: false, denovo: false, criando: false };
function syncCfg() {
  try { const x = JSON.parse(localStorage.getItem(SYNC_KEY) || 'null'); if (x && x.url && x.chave) return x; } catch (e) {}
  return SUPABASE_PADRAO.url && SUPABASE_PADRAO.chave ? SUPABASE_PADRAO : null;
}
function carregarLib() {
  return new Promise((ok, falha) => {
    if (window.supabase?.createClient) return ok();
    const s = document.createElement('script'); s.src = SUPABASE_LIB; s.onload = ok; s.onerror = falha; document.head.append(s);
  });
}
async function iniciarSync() {
  const c = syncCfg();
  if (!c) { SY.estado = 'off'; return renderSync(); }
  if (location.protocol === 'file:') { SY.estado = 'erro'; SY.msg = 'A sincronização funciona no link do GitHub Pages, não no arquivo aberto do computador.'; return renderSync(); }
  try { await carregarLib(); } catch (e) { SY.estado = 'offline'; SY.msg = 'Não consegui carregar o Supabase. Está sem internet?'; return renderSync(); }
  SY.cli = window.supabase.createClient(c.url, c.chave, { auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true, flowType: 'implicit', storageKey: STORAGE_KEY + '-auth' } });
  SY.cli.auth.onAuthStateChange((ev, sess) => {
    const u = sess?.user || null, mudou = (u && u.id) !== (SY.user && SY.user.id);
    SY.user = u;
    if (!u) { SY.estado = 'entrar'; renderSync(); }
    else if (mudou) { setTimeout(puxar, 0); }
  });
}
async function puxar() {
  if (!SY.cli || !SY.user) return;
  if (SY.puxando) { SY.denovo = true; return; }
  SY.puxando = true; clearTimeout(SY.timer);
  try {
    SY.estado = 'salvando'; renderSync();
    const { data, error } = await SY.cli.from('estado_estudos').select('dados, atualizado').eq('user_id', SY.user.id).maybeSingle();
    if (error) throw error;
    const base = S.meta.sincEm || 0, local = S.meta.atualizadoEm || 0, sujo = local > base;
    if (!data) await enviar();
    else if (data.atualizado > base && data.atualizado !== local) {
      const remoto = !sujo || confirmar('Este aparelho e outro têm mudanças diferentes desde a última sincronização.\n\nOK = ficar com a versão salva na nuvem (do outro aparelho)\nCancelar = ficar com a versão deste aparelho');
      if (remoto) aplicarRemoto(data); else await enviar();
    } else if (sujo) await enviar();
    SY.estado = 'ok'; SY.msg = '';
  } catch (e) {
    SY.estado = navigator.onLine === false ? 'offline' : 'erro';
    SY.msg = /estado_estudos|relation|schema cache/i.test(e.message || '') ? 'A tabela estado_estudos não existe no Supabase. Rode o SQL do README.' : (e.message || 'Erro desconhecido');
  }
  SY.puxando = false; renderSync();
  if (SY.denovo) { SY.denovo = false; puxar(); }
}
async function enviar() {
  const ts = S.meta.atualizadoEm || Date.now(); S.meta.atualizadoEm = ts;
  const { error } = await SY.cli.from('estado_estudos').upsert({ user_id: SY.user.id, dados: S, atualizado: ts });
  if (error) throw error;
  S.meta.sincEm = ts; salvar(false);
}
function aplicarRemoto(data) {
  const d = data.dados || {};
  if (!d.config || !Array.isArray(d.materias)) return;
  if (d.config.exemplo && !dadosIniciais().config.exemplo) { S.meta.atualizadoEm = Date.now(); salvar(false); enviar().catch(() => {}); return; } // nuvem ainda com o exemplo
  S = d; S.cards ||= []; S.registros ||= []; S.meta ||= {};
  S.meta.sincEm = data.atualizado; S.meta.atualizadoEm = data.atualizado;
  salvar(false); render(); renderPomo(); toast('Progresso atualizado da nuvem.');
}
function agendarEnvio() {
  if (!SY.user) return;
  SY.estado = 'salvando'; renderSync();
  clearTimeout(SY.timer); SY.timer = setTimeout(puxar, 1500);
}
document.addEventListener('visibilitychange', () => { if (!document.hidden) puxar(); });
window.addEventListener('online', () => puxar());

const SYNC_LBL = { entrar: 'Sincronizar', ok: 'Sincronizado', salvando: 'Salvando…', erro: 'Erro ao sincronizar', offline: 'Offline' };
function syncHtml() {
  if (SY.estado === 'off') return '';
  return `<button class="sync s-${SY.estado}" id="btnSync" title="${esc(SY.msg || (SY.user ? 'Conectada como ' + SY.user.email : 'Entrar para sincronizar entre aparelhos'))}"><span class="sdot"></span>${SYNC_LBL[SY.estado]}</button>`;
}
function renderSync() {
  const b = $('#btnSync'), novo = syncHtml();
  if (b) { if (novo) b.outerHTML = novo; else b.remove(); }
  else if (novo) $('#btnConfig')?.insertAdjacentHTML('beforebegin', novo);
  if ($('#modal').open && $('#syncModal')) modalSync();
}
function modalSync() {
  const c = syncCfg();
  let corpo;
  if (!c) corpo = `<p class="muted">Cole a URL do projeto e a chave pública (anon ou publishable) do Supabase. Elas ficam salvas neste navegador.</p>`;
  else if (!SY.user) corpo = `<p class="muted">Entre com seu e-mail e senha para o progresso ficar igual em todos os aparelhos.</p>
       <form id="formLogin" class="form-grid" style="grid-template-columns:1fr;margin-top:14px">
         <label>E-mail <input type="email" id="syncEmail" required autocomplete="email" placeholder="seu@email.com"></label>
         <label>Senha <input type="password" id="syncSenha" required minlength="6" autocomplete="${SY.criando ? 'new-password' : 'current-password'}" placeholder="${SY.criando ? 'mínimo 6 caracteres' : ''}"></label>
         <div class="row"><button class="btn pri" type="submit">${SY.criando ? 'Criar conta' : 'Entrar'}</button><span class="spacer"></span>
           <button class="btn ghost" type="button" data-acao="syncAlternar">${SY.criando ? 'Já tenho conta' : 'Criar conta'}</button></div>
         <p class="small" id="loginMsg" style="color:var(--bad)" hidden></p>
       </form>`;
  else corpo = `<p>Conectada como <b>${esc(SY.user.email)}</b>.</p>
      <p class="small muted" style="margin-top:6px">${SY.estado === 'ok' ? 'Tudo sincronizado.' : esc(SY.msg || SYNC_LBL[SY.estado] || '')}${S.meta.sincEm ? ` Última sincronização: ${new Date(S.meta.sincEm).toLocaleString('pt-BR', { dateStyle: 'short', timeStyle: 'short' })}.` : ''}</p>
      <div class="modal-f"><button class="btn ghost" data-acao="syncSair">Sair</button><button class="btn pri" data-acao="syncAgora">Sincronizar agora</button></div>`;
  abrirModal(`<div id="syncModal"><h2>Sincronização</h2>${corpo}
    ${SY.estado === 'erro' && SY.msg && !SY.user ? `<p class="small" style="color:var(--bad);margin-top:12px">${esc(SY.msg)}</p>` : ''}
    <details class="modal-sec" ${c ? '' : 'open'}><summary class="small muted" style="cursor:pointer">Projeto Supabase</summary>
      <form id="formSupa" class="form-grid" style="grid-template-columns:1fr;margin-top:12px">
        <label>URL do projeto <input id="supaUrl" placeholder="https://xxxx.supabase.co" value="${esc(c?.url || '')}"></label>
        <label>Chave pública (anon / publishable) <input id="supaChave" placeholder="eyJ… ou sb_publishable_…" value="${esc(c?.chave || '')}"></label>
        <div class="row"><button class="btn" type="submit">Salvar projeto</button></div>
      </form></details></div>`);
  $('#formSupa').onsubmit = ev => {
    ev.preventDefault();
    const url = $('#supaUrl').value.trim().replace(/\/+$/, ''), chave = $('#supaChave').value.trim();
    if (!/^https:\/\/.+/.test(url) || !chave) return toast('Preencha a URL (https://…) e a chave.');
    try { localStorage.setItem(SYNC_KEY, JSON.stringify({ url, chave })); } catch (e) {}
    toast('Projeto salvo. Recarregando…'); setTimeout(() => location.reload(), 600);
  };
  const fl = $('#formLogin');
  if (fl) fl.onsubmit = async ev => {
    ev.preventDefault();
    const msg = $('#loginMsg'), btn = fl.querySelector('button[type=submit]'), rotulo = btn.textContent;
    const erro = t => { msg.textContent = t; msg.hidden = false; btn.disabled = false; btn.textContent = rotulo; };
    if (!SY.cli) return erro(SY.msg || 'A sincronização ainda não carregou. Recarregue a página.');
    const email = $('#syncEmail').value.trim(), password = $('#syncSenha').value;
    btn.disabled = true; btn.textContent = SY.criando ? 'Criando…' : 'Entrando…'; msg.hidden = true;
    if (SY.criando) {
      const { data, error } = await SY.cli.auth.signUp({ email, password });
      if (error) return erro(traduzErro(error.message));
      if (!data.session) return erro('Conta criada, mas o Supabase está pedindo confirmação por e-mail. Desligue "Confirm email" em Authentication → Sign In / Providers → Email e tente entrar.');
    } else {
      const { error } = await SY.cli.auth.signInWithPassword({ email, password });
      if (error) return erro(traduzErro(error.message));
    }
    SY.criando = false; fecharModal(); toast('Conectada. Sincronizando…');
  };
}
function traduzErro(m) {
  if (/invalid login credentials/i.test(m)) return 'E-mail ou senha incorretos.';
  if (/email not confirmed/i.test(m)) return 'Esse e-mail ainda não foi confirmado. Confirme pelo e-mail ou marque o usuário como confirmado no Supabase.';
  if (/already registered|already exists/i.test(m)) return 'Esse e-mail já tem conta. Use “Já tenho conta”.';
  if (/signups not allowed|signup is disabled/i.test(m)) return 'Novos cadastros estão desligados neste projeto.';
  if (/password/i.test(m) && /6|short|weak/i.test(m)) return 'Senha fraca: use pelo menos 6 caracteres.';
  return 'Não deu certo: ' + m;
}

/* Início */
carregar(); carregarP(); salvar(false); render(); renderPomo(); iniciarSync();
</script>
