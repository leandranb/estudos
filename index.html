<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mentor de Estudos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f6f3; --surface:#ffffff; --surface-2:#fbfbf9; --line:#e6e4de; --ink:#1d2127; --muted:#6b7079;
  --accent:#4f46e5; --accent-soft:#eef0ff;
  --alta:#e5484d; --media:#e79d13; --baixa:#2f9e66;
  --red:#d93d42; --yellow:#c98a00; --green:#2a9160;
  --radius:12px; --shadow:0 1px 2px rgba(20,20,30,.05),0 2px 8px rgba(20,20,30,.04);
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:'DM Sans',system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.45}
h1,h2,h3,h4,.tag,button,.btn,.tab,header,.kpi b,th{font-family:'Outfit',system-ui,sans-serif}
input,select,textarea{font-family:'DM Sans',system-ui,sans-serif;font-size:14px;color:var(--ink)}
h2{font-size:20px;margin:0 0 12px;font-weight:600}
h3{font-size:16px;margin:0 0 8px;font-weight:600}
.muted{color:var(--muted)}
.small{font-size:12px}

/* Topo */
header{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.topo{max-width:1500px;margin:0 auto;padding:10px 20px;display:flex;flex-wrap:wrap;gap:14px 24px;align-items:center;justify-content:space-between}
.marca h1{font-size:18px;margin:0;font-weight:700;letter-spacing:-.01em}
.marca .sub{font-size:12px;color:var(--muted)}
.contagem{display:flex;align-items:center;gap:12px;position:relative}
.contagem .num{font-family:'Outfit';font-size:28px;font-weight:700;line-height:1;color:var(--accent)}
.contagem .lbl{font-size:12px;color:var(--muted);line-height:1.25}
.ctrl{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ctrl label{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.ctrl input[type=number]{width:64px}
input,select,textarea{border:1px solid var(--line);border-radius:8px;padding:6px 8px;background:#fff}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent-soft);border-color:var(--accent)}
button,.btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 12px;cursor:pointer;font-size:13px;font-weight:500;color:var(--ink)}
button:hover{border-color:#c9c6bd}
button.pri{background:var(--accent);border-color:var(--accent);color:#fff}
button.pri:hover{filter:brightness(1.08)}
button.ghost{border-color:transparent;background:transparent}
button.danger{color:var(--red)}
button.icon{padding:3px 7px;font-size:13px;line-height:1}

/* Mini calendário */
.cal-pop{position:absolute;top:calc(100% + 8px);left:0;background:#fff;border:1px solid var(--line);border-radius:var(--radius);box-shadow:0 8px 30px rgba(0,0,0,.12);padding:12px;width:260px;display:none;z-index:30}
.cal-pop.open{display:block}
.cal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;font-family:'Outfit';font-weight:600}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center;font-size:12px}
.cal-grid .dow{color:var(--muted);font-family:'Outfit';font-weight:500}
.cal-grid .d{padding:5px 0;border-radius:6px}
.cal-grid .d.out{color:#c4c2bb}
.cal-grid .d.hoje{background:var(--accent-soft);color:var(--accent);font-weight:700}
.cal-grid .d.prova{background:var(--alta);color:#fff;font-weight:700}
.cal-grid .d.plano{box-shadow:inset 0 -2px 0 #d9d6ff}

/* Abas */
nav.abas{max-width:1500px;margin:0 auto;padding:0 20px;display:flex;gap:4px;overflow-x:auto}
.tab{border:none;background:none;padding:10px 14px;border-bottom:2px solid transparent;border-radius:0;color:var(--muted);font-size:14px;white-space:nowrap}
.tab.on{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
main{max-width:1500px;margin:0 auto;padding:20px}

.banner{background:#fff8e6;border:1px solid #f3dfa6;color:#6b5100;border-radius:var(--radius);padding:10px 14px;margin-bottom:16px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.banner.info{background:var(--accent-soft);border-color:#d6d9ff;color:#2f2a8a}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);margin-bottom:16px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}

/* Semanas */
.semanas{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:12px}
.semanas button{white-space:nowrap;padding:6px 10px;font-size:12px}
.semanas button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.semanas button.atual:not(.on){border-color:var(--accent);color:var(--accent)}
.semanas button.rev:not(.on){background:#fff3f3}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:none;border-radius:0;padding:6px 12px}
.seg button.on{background:var(--ink);color:#fff}

.grid-dias{display:grid;grid-template-columns:repeat(7,minmax(180px,1fr));gap:10px;overflow-x:auto;padding-bottom:8px}
.col{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--radius);padding:8px;min-height:340px;display:flex;flex-direction:column;transition:background .15s}
.col.hoje{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.col.over{background:var(--accent-soft)}
.col.fora{opacity:.55}
.col-h{padding:2px 4px 8px;border-bottom:1px solid var(--line);margin-bottom:8px}
.col-h .t{font-family:'Outfit';font-weight:600;display:flex;justify-content:space-between;align-items:center}
.col-h .m{font-size:11px;color:var(--muted)}
.alerta{font-size:11px;color:var(--red);margin-top:4px}
.zona{flex:1;min-height:60px}
.add-dia{margin-top:6px;width:100%;border-style:dashed;color:var(--muted);background:transparent}

.grid-kanban{display:grid;grid-template-columns:repeat(4,minmax(220px,1fr));gap:12px;overflow-x:auto}
.grid-kanban .col{min-height:420px}

.card{background:#fff;border:1px solid var(--line);border-left:4px solid var(--c,#999);border-radius:10px;padding:8px 9px;margin-bottom:8px;cursor:grab;box-shadow:var(--shadow)}
.card.drag{opacity:.4}
.card.fin{opacity:.72}
.card.fin .tit{text-decoration:line-through;text-decoration-color:#bbb}
.card .tags{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:5px}
.card .tit{font-weight:500;font-size:13px;margin-bottom:5px;word-break:break-word}
.card .meta{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:11px;color:var(--muted);margin-bottom:6px}
.card .acoes{display:flex;gap:4px;align-items:center}
.card .acoes select{font-size:12px;padding:3px 5px;flex:1;min-width:0}
.tag{display:inline-block;font-size:11px;padding:2px 8px;border-radius:999px;font-weight:600;line-height:1.5;
  background:color-mix(in srgb,var(--c,#888) 14%,#fff);color:color-mix(in srgb,var(--c,#888) 78%,#000);white-space:nowrap}
.inc-alta{--c:var(--alta)} .inc-media{--c:var(--media)} .inc-baixa{--c:var(--baixa)}
.st{font-size:11px;padding:1px 7px;border-radius:6px;font-family:'Outfit';font-weight:500}
.st-afazer{background:#f0efea;color:#5b5f66}
.st-iniciado{background:#e6f0ff;color:#2459c4}
.st-revisar{background:#fff1dc;color:#9a5c00}
.st-finalizado{background:#e2f5ea;color:#1f7a4b}
.st-nao{background:#f6f6f6;color:#999}

/* Tabelas */
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:12px;color:var(--muted);font-weight:500}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.tbl-wrap{overflow-x:auto}

/* Barras */
.bar{height:10px;background:#efede8;border-radius:99px;overflow:hidden;position:relative}
.bar>i{display:block;height:100%;background:var(--c,var(--accent));border-radius:99px}
.bar.dupla>i.plan{position:absolute;inset:0 auto 0 0;background:color-mix(in srgb,var(--c,var(--accent)) 25%,#fff)}
.bar.dupla>i.real{position:absolute;inset:0 auto 0 0}
.barrow{display:grid;grid-template-columns:minmax(120px,220px) 1fr 110px;gap:12px;align-items:center;margin:8px 0}
.barrow .v{text-align:right;font-variant-numeric:tabular-nums;font-size:12px;color:var(--muted)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:14px}
.kpi b{display:block;font-size:26px;font-weight:700}
.kpi span{font-size:12px;color:var(--muted)}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--c);margin-right:6px;vertical-align:middle}

.pct{font-weight:700;font-family:'Outfit';padding:2px 8px;border-radius:6px}
.pct.r{color:var(--red);background:#fdecec}
.pct.y{color:var(--yellow);background:#fff6dc}
.pct.g{color:var(--green);background:#e4f5ec}

.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;align-items:end}
.form-grid label,.campo{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{font-size:11px;background:#f2f1ec;border-radius:6px;padding:2px 7px}
.chip.ok{background:#e2f5ea;color:#1f7a4b}

dialog{border:none;border-radius:16px;padding:0;max-width:560px;width:calc(100% - 32px);box-shadow:0 20px 60px rgba(0,0,0,.25)}
dialog::backdrop{background:rgba(20,20,30,.35)}
.modal-c{padding:20px}
.modal-c .form-grid{grid-template-columns:1fr 1fr}
.modal-c .full{grid-column:1/-1}
.modal-f{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}

#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:100;max-width:90vw}
#toast.on{opacity:1}
details summary{cursor:pointer;font-family:'Outfit';font-weight:500}
.mat-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.mat-h h3{margin:0}
.mat-h input[type=color]{width:30px;height:26px;padding:0;border:none;background:none}
@media (max-width:700px){ .topo{padding:10px 16px} main{padding:16px} .barrow{grid-template-columns:1fr;gap:4px} .barrow .v{text-align:left} }
</style>
</head>
<body>
<header>
  <div class="topo" id="topo"></div>
  <nav class="abas" id="abas"></nav>
</header>
<main id="main"></main>
<dialog id="modal"><div class="modal-c" id="modalBody"></div></dialog>
<div id="toast"></div>
<input type="file" id="fileImport" accept="application/json,.json" hidden>

<script>
/* ================= Utilidades ================= */
const STORAGE_KEY = 'mentor-concursos-v1';
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Math.random().toString(36).slice(2, 10);
const pd = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const iso = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
const addD = (d, n) => { const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); x.setDate(x.getDate() + n); return x; };
const monday = d => addD(d, -((d.getDay() + 6) % 7));
const diffDias = (a, b) => Math.round((b - a) / 864e5);
const hoje = () => iso(new Date());
const fmtBR = s => s ? s.split('-').reverse().join('/') : '—';
const fmtCurto = s => { const [, m, d] = s.split('-'); return `${d}/${m}`; };
const fmtH = min => { min = Math.max(0, Math.round(min || 0)); return `${String(Math.floor(min / 60)).padStart(2, '0')}:${String(min % 60).padStart(2, '0')}h`; };
const parseH = str => { const m = /^\s*(\d{1,3}):([0-5]\d)\s*h?\s*$/i.exec(str || ''); return m ? (+m[1]) * 60 + (+m[2]) : null; };
const r5 = n => Math.round(n / 5) * 5;
const DIAS = ['Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb', 'Dom'];
const DIAS_LONGOS = ['Segunda', 'Terça', 'Quarta', 'Quinta', 'Sexta', 'Sábado', 'Domingo'];
const MESES = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const INC = { alta: 3, media: 2, baixa: 1 };
const INC_LBL = { alta: 'Alta', media: 'Média', baixa: 'Baixa' };
const STATUS = { afazer: 'A fazer', iniciado: 'Iniciado', revisar: 'Revisar', finalizado: 'Finalizado' };
const COMO = ['Questões', 'Aula', 'Leitura'];
const TIPOS = { conteudo: 'Conteúdo', revisao: 'Revisão espaçada', revisaoGeral: 'Revisão geral', simulado: 'Simulado', revisaoSemanal: 'Revisão semanal', redacao: 'Redação' };
const COR_TIPO = { simulado: '#475569', revisaoSemanal: '#64748b', redacao: '#b45309' };
const CONTA_LIMITE = new Set(['conteudo', 'revisaoGeral']); // tipos que contam na regra de disciplinas/dia

function toast(msg, ms = 2600) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('on');
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('on'), ms);
}

/* ================= Estado ================= */
let S; // estado completo
const UI = { aba: 'plan', semana: null, vista: 'dias', calMes: null, calOpen: false, editReg: null };

function dadosIniciais() { return JSON.parse($('#dados-iniciais').textContent); }

function carregar() {
  let salvo = null;
  try { salvo = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null'); } catch (e) { salvo = null; }
  if (salvo && salvo.config && salvo.materias) { S = salvo; }
  else { S = dadosIniciais(); S.cards = []; S.registros = []; gerarCronograma(); }
  S.cards ||= []; S.registros ||= []; S.meta ||= {};
  try { const ui = JSON.parse(localStorage.getItem(STORAGE_KEY + '-ui') || '{}'); if (ui.aba) UI.aba = ui.aba; if (ui.vista) UI.vista = ui.vista; } catch (e) {}
}
function salvar() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(S)); } catch (e) { toast('Não foi possível salvar no navegador. Exporte um backup.'); }
  try { localStorage.setItem(STORAGE_KEY + '-ui', JSON.stringify({ aba: UI.aba, vista: UI.vista })); } catch (e) {}
}

/* ================= Datas do plano ================= */
const inicioSeg = () => monday(pd(S.config.inicio));
function numSemanas() {
  const c = S.config;
  if (c.prova) return Math.max(1, Math.ceil((diffDias(inicioSeg(), pd(c.prova)) + 1) / 7));
  return Math.max(1, +c.semanas || 1);
}
const semanaDe = dt => Math.floor(diffDias(inicioSeg(), pd(dt)) / 7);
const diaDe = dt => (pd(dt).getDay() + 6) % 7;
const dataDe = (w, d) => iso(addD(inicioSeg(), w * 7 + d));
const semanaRevisao = w => numSemanas() >= 2 && w === numSemanas() - 1;
function ultimoDiaPlano() {
  const fim = addD(inicioSeg(), numSemanas() * 7 - 1);
  if (S.config.prova) { const p = addD(pd(S.config.prova), -1); return iso(p < fim ? p : fim); }
  return iso(fim);
}

/* ================= Lookups ================= */
const mat = id => S.materias.find(m => m.id === id);
function assunto(id) { for (const m of S.materias) { const a = m.assuntos.find(a => a.id === id); if (a) return { a, m }; } return null; }
const proibido = (a, b) => (S.config.paresProibidos || []).some(([x, y]) => (x === a && y === b) || (x === b && y === a));
const relev = m => (+m.questoes || 1) * (+m.peso || 1) * (INC[m.incidencia] || 1);

/* ================= Ciclo (peso × incidência) ================= */
function minutosConteudoSemana() {
  const c = S.config;
  return Math.max(0, c.horasDia * 60 * 6 - (c.discursiva ? (+c.redacaoMin || 0) : 0));
}
function ciclo() {
  const total = minutosConteudoSemana();
  const soma = S.materias.reduce((s, m) => s + relev(m), 0) || 1;
  return S.materias.map(m => ({ m, rel: relev(m), pct: relev(m) / soma, min: r5(total * relev(m) / soma) }));
}

/* Distribui as matérias pelos dias (seg–sáb) respeitando o limite/dia e os pares proibidos */
function atribuirDias(cic, extraSabado, disponiveis) {
  const max = +S.config.maxDisciplinasDia || 3;
  const dias = Array.from({ length: 6 }, (_, i) => ({ mats: [], load: i === 5 ? extraSabado : 0, ok: disponiveis.includes(i) }));
  const nDisp = disponiveis.length;
  const itens = cic.filter(x => x.min > 0).map(x => ({ ...x, n: Math.min(nDisp, Math.max(1, Math.round(x.min / 90))) }));
  let tot = itens.reduce((s, x) => s + x.n, 0);
  while (tot > nDisp * max) { const big = itens.filter(x => x.n > 1).sort((a, b) => b.n - a.n)[0]; if (!big) break; big.n--; tot--; }
  itens.sort((a, b) => b.min - a.min);
  const mapa = {};
  for (const it of itens) {
    const escolhidos = [];
    for (let k = 0; k < it.n; k++) {
      const cand = dias.map((d, i) => ({ d, i })).filter(({ d, i }) => d.ok && !escolhidos.includes(i) && d.mats.length < max && !d.mats.some(m => proibido(m, it.m.id)));
      if (!cand.length) break;
      const pen = i => escolhidos.some(j => Math.abs(j - i) === 1) ? 45 : 0;
      cand.sort((a, b) => (a.d.load + pen(a.i)) - (b.d.load + pen(b.i)) || a.i - b.i);
      escolhidos.push(cand[0].i);
    }
    if (!escolhidos.length) { // sem dia válido: usa o menos carregado (o app sinaliza o conflito)
      const i = dias.map((d, i) => i).filter(i => dias[i].ok).sort((a, b) => dias[a].load - dias[b].load)[0];
      if (i === undefined) continue; escolhidos.push(i);
    }
    const porDia = it.min / escolhidos.length;
    escolhidos.forEach(i => { dias[i].mats.push(it.m.id); dias[i].load += porDia; });
    mapa[it.m.id] = escolhidos.sort((a, b) => a - b);
  }
  return mapa;
}

/* ================= Geração do cronograma ================= */
function novoCard(o) {
  return Object.assign({ id: uid(), tipo: 'conteudo', status: 'afazer', como: 'Questões', minutos: 30, auto: true }, o);
}
function gerarCronograma() {
  const c = S.config, W = numSemanas(), temRev = W >= 2, wConteudo = temRev ? W - 1 : W;
  const cic = ciclo(), ini = pd(c.inicio), prova = c.prova ? pd(c.prova) : null;
  const cards = [];
  const disp = w => [0, 1, 2, 3, 4, 5].filter(d => { const dt = addD(inicioSeg(), w * 7 + d); return dt >= ini && (!prova || dt < prova); });

  const semanas = [];
  for (let w = 0; w < wConteudo; w++) {
    const dd = disp(w); if (!dd.length) continue;
    const sab = dd.includes(5) && c.discursiva ? (+c.redacaoMin || 0) : 0;
    semanas.push({ w, dd, fator: dd.length / 6, mapa: atribuirDias(cic, sab, dd) });
  }

  for (const m of S.materias) {
    const x = cic.find(k => k.m.id === m.id);
    if (!m.assuntos.length || !x.min) continue;
    const total = semanas.reduce((s, sw) => s + (sw.mapa[m.id] ? x.min * sw.fator : 0), 0);
    const pesos = m.assuntos.map(a => INC[a.incidencia] || 1), sp = pesos.reduce((a, b) => a + b, 0);
    const fila = m.assuntos.map((a, i) => ({ a, rest: total * pesos[i] / sp }));
    const cobertos = new Set(); let ultimo = null;
    for (const sw of semanas) {
      const dias = sw.mapa[m.id] || []; if (!dias.length) continue;
      const porDia = x.min * sw.fator / dias.length;
      for (const d of dias) {
        let cap = porDia; const dt = dataDe(sw.w, d);
        while (cap > 0.01 && fila.length) {
          const f = fila[0], take = Math.min(cap, f.rest), min = r5(take);
          if (ultimo && ultimo.assuntoId === f.a.id && ultimo.data === dt) ultimo.minutos += min;
          else if (min >= 5) { ultimo = novoCard({ materiaId: m.id, assuntoId: f.a.id, titulo: f.a.nome, data: dt, minutos: min }); cards.push(ultimo); cobertos.add(f.a.id); }
          f.rest -= take; cap -= take; if (f.rest < 0.01) fila.shift();
        }
      }
    }
    // Garantia de cobertura: nenhum assunto fica de fora
    m.assuntos.filter(a => !cobertos.has(a.id)).forEach(a => {
      const dt = ultimo ? ultimo.data : dataDe(0, 0);
      cards.push(novoCard({ materiaId: m.id, assuntoId: a.id, titulo: a.nome, data: dt, minutos: 15 }));
    });
  }
  // Numera partes de assuntos divididos em vários blocos
  const porAss = {};
  cards.forEach(k => (porAss[k.assuntoId] ||= []).push(k));
  Object.values(porAss).forEach(l => { if (l.length > 1) { l.sort((a, b) => a.data.localeCompare(b.data)); l.forEach((k, i) => k.titulo += ` (${i + 1}/${l.length})`); } });

  // Redação (sábado) e domingo (simulado + revisão)
  for (const sw of semanas) {
    if (c.discursiva && sw.dd.includes(5)) cards.push(novoCard({ tipo: 'redacao', titulo: 'Redação — produção e correção de texto', data: dataDe(sw.w, 5), minutos: +c.redacaoMin || 60, como: 'Leitura' }));
    const dom = addD(inicioSeg(), sw.w * 7 + 6);
    if (!prova || dom < prova) {
      const h = c.horasDia * 60;
      cards.push(novoCard({ tipo: 'simulado', titulo: 'Simulado semanal', data: iso(dom), minutos: r5(h * 0.6) }));
      cards.push(novoCard({ tipo: 'revisaoSemanal', titulo: 'Revisão da semana + correção do simulado', data: iso(dom), minutos: r5(h * 0.4), como: 'Leitura' }));
    }
  }
  // Última semana: 100% revisão
  if (temRev) {
    const w = W - 1, dd = disp(w);
    if (dd.length) {
      const totalRev = c.horasDia * 60 * dd.length, soma = cic.reduce((s, x) => s + x.rel, 0) || 1;
      const cicRev = cic.map(x => ({ ...x, min: r5(totalRev * x.rel / soma) }));
      const mapa = atribuirDias(cicRev, 0, dd);
      for (const x of cicRev) {
        const dias = mapa[x.m.id] || []; if (!dias.length) continue;
        dias.forEach(d => cards.push(novoCard({ tipo: 'revisaoGeral', materiaId: x.m.id, titulo: `Revisão geral — ${x.m.nome}`, data: dataDe(w, d), minutos: r5(x.min / dias.length), como: 'Questões' })));
      }
      const dom = addD(inicioSeg(), w * 7 + 6);
      if (!prova || dom < prova) cards.push(novoCard({ tipo: 'simulado', titulo: 'Simulado final + revisão dos erros', data: iso(dom), minutos: c.horasDia * 60 }));
    }
  }
  // Mantém tópicos criados manualmente
  S.cards = (S.cards || []).filter(k => !k.auto).concat(cards);
  S.meta = { semanasGeradas: W, horasGeradas: c.horasDia, geradoEm: hoje() };
}

/* Ao mudar horas/dia: recalcula o ciclo e reescala os blocos ainda não finalizados */
function mudarHoras(novo) {
  novo = Math.max(0.5, Math.min(16, +novo || 0));
  const antigo = S.config.horasDia; if (!novo || novo === antigo) return;
  const f = novo / antigo;
  S.cards.forEach(k => { if (k.auto && k.status !== 'finalizado' && k.tipo !== 'redacao' && k.tipo !== 'revisao') k.minutos = Math.max(5, r5(k.minutos * f)); });
  S.config.horasDia = novo; S.meta.horasGeradas = novo;
  salvar(); render(); toast(`Carga ajustada para ${novo}h/dia — ciclo recalculado.`);
}

/* ================= Status e revisão espaçada ================= */
function setStatus(card, st) {
  const prev = card.status; if (prev === st) return;
  card.status = st;
  if (st === 'finalizado') {
    card.finalizadoEm = hoje();
    if (card.materiaId && card.tipo === 'conteudo') criarRevisoes(card);
  } else if (prev === 'finalizado') {
    delete card.finalizadoEm;
    S.cards = S.cards.filter(k => !(k.tipo === 'revisao' && k.origemId === card.id && k.status === 'afazer'));
  }
  salvar();
}
function criarRevisoes(card) {
  const lim = ultimoDiaPlano();
  const dias = S.config.revisoesDias || [1, 7, 30];
  const base = assunto(card.assuntoId)?.a.nome || card.titulo.replace(/ \(\d+\/\d+\)$/, '');
  dias.forEach((n, i) => {
    let dt = iso(addD(new Date(), n)); if (dt > lim) dt = lim; if (dt < S.config.inicio) dt = S.config.inicio;
    S.cards.push(novoCard({ tipo: 'revisao', auto: true, origemId: card.id, materiaId: card.materiaId, assuntoId: card.assuntoId,
      titulo: `Revisão ${n}d — ${base}`, data: dt, minutos: i === 0 ? 20 : 15, como: 'Questões' }));
  });
  toast(`Revisões criadas para ${dias.map(d => d + 'd').join(', ')}.`);
}

/* ================= Regras por dia ================= */
function materiasDoDia(dt, excluirId) {
  return [...new Set(S.cards.filter(k => k.data === dt && k.id !== excluirId && k.materiaId && CONTA_LIMITE.has(k.tipo)).map(k => k.materiaId))];
}
function violacoes(mats) {
  const out = [], max = +S.config.maxDisciplinasDia || 3;
  if (mats.length > max) out.push(`${mats.length} disciplinas no dia (máximo ${max})`);
  for (let i = 0; i < mats.length; i++) for (let j = i + 1; j < mats.length; j++)
    if (proibido(mats[i], mats[j])) out.push(`${mat(mats[i])?.nome} × ${mat(mats[j])?.nome} no mesmo dia`);
  return out;
}
function checarMover(card, dt) {
  if (!card.materiaId || !CONTA_LIMITE.has(card.tipo)) return [];
  const mats = materiasDoDia(dt, card.id); if (!mats.includes(card.materiaId)) mats.push(card.materiaId);
  return violacoes(mats);
}

/* ================= Derivados ================= */
function statusAssunto(aid) {
  const l = S.cards.filter(k => k.assuntoId === aid && k.tipo === 'conteudo');
  if (!l.length) return 'nao';
  if (l.every(k => k.status === 'finalizado')) return 'finalizado';
  if (l.some(k => k.status === 'revisar')) return 'revisar';
  if (l.some(k => k.status !== 'afazer')) return 'iniciado';
  return 'afazer';
}
const cardsSemana = w => S.cards.filter(k => semanaDe(k.data) === w);
const topicos = l => l.filter(k => k.tipo === 'conteudo' || k.tipo === 'revisaoGeral');
const pctFin = l => l.length ? Math.round(100 * l.filter(k => k.status === 'finalizado').length / l.length) : 0;
const regsSemana = w => S.registros.filter(r => semanaDe(r.data) === w);
function acertos(q, e) { q = +q || 0; e = +e || 0; return q ? Math.round(1000 * (q - e) / q) / 10 : null; }
function pctHtml(p) { if (p === null) return '<span class="muted">—</span>'; const cl = p < 70 ? 'r' : p <= 80 ? 'y' : 'g'; return `<span class="pct ${cl}">${String(p).replace('.', ',')}%</span>`; }

/* ================= Render: topo ================= */
function renderTopo() {
  const c = S.config, W = numSemanas();
  let num, lbl;
  if (c.prova) {
    const d = diffDias(pd(hoje()), pd(c.prova));
    num = d >= 0 ? d : 0;
    lbl = d > 0 ? `dias até a prova<br><b>${fmtBR(c.prova)}</b> · ${W} semanas` : d === 0 ? 'É hoje! Boa prova.' : 'prova realizada';
  } else { num = W; lbl = `semanas planejadas<br><b>Prova: a definir</b>`; }
  $('#topo').innerHTML = `
    <div class="marca"><h1>Mentor de Estudos</h1><div class="sub">${esc(c.concurso)} · Banca: ${esc(c.banca)}</div></div>
    <div class="contagem">
      <div class="num">${num}</div><div class="lbl">${lbl}</div>
      <button class="icon ghost" id="btnCal" title="Calendário">📅</button>
      <div class="cal-pop ${UI.calOpen ? 'open' : ''}" id="calPop">${renderCal()}</div>
    </div>
    <div class="ctrl">
      <label>Data da prova <input type="date" id="inProva" value="${c.prova || ''}"></label>
      <label><input type="checkbox" id="inDefinir" ${c.prova ? '' : 'checked'}> a definir</label>
      <label>Horas/dia <input type="number" id="inHoras" min="0.5" max="16" step="0.5" value="${c.horasDia}"></label>
      <button id="btnConfig">⚙ Configurações</button>
      <button id="btnExport" title="Baixar backup em JSON">⬇ Exportar</button>
      <button id="btnImport" title="Carregar backup JSON">⬆ Importar</button>
    </div>`;
}
function renderCal() {
  const base = UI.calMes || (S.config.prova ? pd(S.config.prova) : new Date());
  const y = base.getFullYear(), mo = base.getMonth();
  const primeiro = new Date(y, mo, 1), ini = monday(primeiro);
  const t = hoje(), p = S.config.prova, a = iso(inicioSeg()), z = ultimoDiaPlano();
  let h = `<div class="cal-head"><button class="icon ghost" data-cal="-1">‹</button>${MESES[mo]} ${y}<button class="icon ghost" data-cal="1">›</button></div><div class="cal-grid">`;
  h += DIAS.map(d => `<div class="dow">${d[0]}</div>`).join('');
  for (let i = 0; i < 42; i++) {
    const d = addD(ini, i), s = iso(d);
    const cl = ['d', d.getMonth() !== mo ? 'out' : '', s === t ? 'hoje' : '', s === p ? 'prova' : '', s >= a && s <= z ? 'plano' : ''].join(' ');
    h += `<div class="${cl}" title="${fmtBR(s)}">${d.getDate()}</div>`;
  }
  return h + `</div><div class="small muted" style="margin-top:8px">Sublinhado: período do plano · Vermelho: prova</div>`;
}

/* ================= Render: abas ================= */
const ABAS = [['plan', 'Planejamento semanal'], ['ciclo', 'Ciclos de estudo'], ['mat', 'Matérias'], ['stats', 'Estatísticas'], ['tempo', 'Tempo de estudos']];
function renderAbas() { $('#abas').innerHTML = ABAS.map(([k, n]) => `<button class="tab ${UI.aba === k ? 'on' : ''}" data-aba="${k}">${n}</button>`).join(''); }

function banners() {
  let h = '';
  if (S.config.exemplo) h += `<div class="banner"><span>📌 <b>Dados de exemplo.</b> ${esc(S.config.edital || '')} Edite o JSON no arquivo ou importe um backup com o seu plano.</span></div>`;
  if (S.meta.semanasGeradas && S.meta.semanasGeradas !== numSemanas())
    h += `<div class="banner info"><span>O período mudou de ${S.meta.semanasGeradas} para ${numSemanas()} semanas.</span><button class="pri" data-acao="regerar">Regerar cronograma</button></div>`;
  return h;
}

function render() {
  if (UI.semana === null) { const w = semanaDe(hoje()); UI.semana = Math.min(Math.max(0, w), numSemanas() - 1); }
  UI.semana = Math.min(UI.semana, numSemanas() - 1);
  renderTopo(); renderAbas();
  const f = { plan: renderPlan, ciclo: renderCiclo, mat: renderMaterias, stats: renderStats, tempo: renderTempo }[UI.aba];
  $('#main').innerHTML = banners() + f();
  if (UI.aba === 'tempo') montarTempo();
}

/* ---------- Card ---------- */
function cardHtml(k, mostrarDia) {
  const m = mat(k.materiaId), ass = k.assuntoId ? assunto(k.assuntoId) : null;
  const cor = m ? m.cor : (COR_TIPO[k.tipo] || '#64748b');
  const inc = ass ? ass.a.incidencia : (m ? m.incidencia : null);
  return `<div class="card ${k.status === 'finalizado' ? 'fin' : ''}" draggable="true" data-id="${k.id}" style="--c:${cor}">
    <div class="tags">
      <span class="tag" style="--c:${cor}">${esc(m ? m.nome : TIPOS[k.tipo])}</span>
      ${inc ? `<span class="tag inc-${inc}">${INC_LBL[inc]}</span>` : ''}
      ${k.tipo === 'revisao' || k.tipo === 'revisaoGeral' ? `<span class="tag" style="--c:#0891b2">${TIPOS[k.tipo]}</span>` : ''}
    </div>
    <div class="tit">${esc(k.titulo)}</div>
    <div class="meta"><span>⏱ ${fmtH(k.minutos)}</span><span class="st st-${k.status}">${STATUS[k.status]}</span>${mostrarDia ? `<span>${DIAS[diaDe(k.data)]} ${fmtCurto(k.data)}</span>` : ''}</div>
    <div class="acoes">
      <select data-como="${k.id}" title="Como concluir">${COMO.map(o => `<option ${k.como === o ? 'selected' : ''}>${o}</option>`).join('')}</select>
      <button class="icon" data-edit="${k.id}" title="Editar">✎</button>
      <button class="icon danger" data-del="${k.id}" title="Excluir">🗑</button>
    </div>
  </div>`;
}
const ORDEM_TIPO = { revisao: 0, conteudo: 1, revisaoGeral: 1, redacao: 2, simulado: 3, revisaoSemanal: 4 };
const ordenar = l => l.sort((a, b) => (ORDEM_TIPO[a.tipo] - ORDEM_TIPO[b.tipo]) || (S.materias.indexOf(mat(a.materiaId)) - S.materias.indexOf(mat(b.materiaId))));

/* ---------- Planejamento ---------- */
function renderPlan() {
  const W = numSemanas(), w = UI.semana, atual = semanaDe(hoje());
  let h = `<div class="semanas">`;
  for (let i = 0; i < W; i++) {
    const ini = dataDe(i, 0), fim = dataDe(i, 6);
    h += `<button data-sem="${i}" class="${i === w ? 'on' : ''} ${i === atual ? 'atual' : ''} ${semanaRevisao(i) ? 'rev' : ''}">S${i + 1} · ${fmtCurto(ini)}–${fmtCurto(fim)}${semanaRevisao(i) ? ' · Revisão' : ''}</button>`;
  }
  h += `</div>`;
  const lista = cardsSemana(w);
  h += `<div class="row" style="margin-bottom:12px">
      <h2 style="margin:0">Semana ${w + 1}${semanaRevisao(w) ? ' — 100% revisão' : ''}</h2>
      <span class="muted">${pctFin(topicos(lista))}% dos tópicos finalizados</span>
      <span class="spacer"></span>
      <div class="seg"><button data-vista="dias" class="${UI.vista === 'dias' ? 'on' : ''}">Dias da semana</button><button data-vista="kanban" class="${UI.vista === 'kanban' ? 'on' : ''}">Kanban</button></div>
      <button class="pri" data-add="${dataDe(w, Math.max(0, Math.min(6, w === atual ? diaDe(hoje()) : 0)))}">+ Adicionar tópico</button>
    </div>`;
  h += metasSemana(w, lista);
  if (UI.vista === 'dias') {
    h += `<div class="grid-dias">`;
    const lim = ultimoDiaPlano(), ini = S.config.inicio;
    for (let d = 0; d < 7; d++) {
      const dt = dataDe(w, d), doDia = ordenar(lista.filter(k => k.data === dt));
      const plan = doDia.reduce((s, k) => s + k.minutos, 0), viol = violacoes(materiasDoDia(dt));
      const tipoDia = d === 6 ? 'Simulado e revisão' : (semanaRevisao(w) ? 'Revisão' : (d === 5 && S.config.discursiva ? 'Conteúdo + redação' : 'Conteúdo novo'));
      const prova = dt === S.config.prova;
      h += `<div class="col ${dt === hoje() ? 'hoje' : ''} ${dt < ini || dt > lim ? 'fora' : ''}" data-drop-dia="${dt}">
        <div class="col-h"><div class="t"><span>${DIAS_LONGOS[d]}</span><span class="muted small">${fmtCurto(dt)}</span></div>
        <div class="m">${prova ? '🎯 <b>Dia da prova</b>' : tipoDia}</div>
        <div class="m">Meta: ${fmtH(S.config.horasDia * 60)} · Planejado: ${fmtH(plan)}</div>
        ${viol.map(v => `<div class="alerta">⚠ ${esc(v)}</div>`).join('')}</div>
        <div class="zona">${doDia.map(k => cardHtml(k)).join('')}</div>
        <button class="add-dia" data-add="${dt}">+ tópico</button>
      </div>`;
    }
    h += `</div>`;
  } else {
    h += `<div class="grid-kanban">`;
    for (const st of Object.keys(STATUS)) {
      const l = lista.filter(k => k.status === st).sort((a, b) => a.data.localeCompare(b.data));
      h += `<div class="col" data-drop-st="${st}"><div class="col-h"><div class="t"><span>${STATUS[st]}</span><span class="st st-${st}">${l.length}</span></div></div>
        <div class="zona">${l.map(k => cardHtml(k, true)).join('')}</div></div>`;
    }
    h += `</div>`;
  }
  return h;
}
function metasSemana(w, lista) {
  const regs = regsSemana(w);
  const linhas = S.materias.map(m => {
    const l = lista.filter(k => k.materiaId === m.id && k.tipo !== 'revisao');
    const plan = l.reduce((s, k) => s + k.minutos, 0); if (!plan) return '';
    const dias = [...new Set(l.map(k => diaDe(k.data)))].sort().map(d => DIAS[d]).join(', ');
    const feito = regs.filter(r => r.materiaId === m.id).reduce((s, r) => s + r.minutos, 0);
    const top = topicos(l), fin = top.filter(k => k.status === 'finalizado').length;
    const p = Math.min(100, plan ? Math.round(100 * feito / plan) : 0);
    return `<tr><td><span class="dot" style="--c:${m.cor}"></span>${esc(m.nome)}</td><td class="small muted">${dias}</td>
      <td class="num">${fmtH(plan)}</td><td class="num">${fmtH(plan / Math.max(1, dias.split(',').length))}</td><td class="num">${fmtH(feito)}</td>
      <td style="width:22%"><div class="bar"><i style="width:${p}%;--c:${m.cor}"></i></div></td><td class="num">${fin}/${top.length}</td></tr>`;
  }).join('');
  return `<details class="panel" ${UI.metasOpen ? 'open' : ''} id="metas"><summary>Metas da semana por matéria</summary>
    <div class="tbl-wrap" style="margin-top:10px"><table><thead><tr><th>Matéria</th><th>Dias</th><th class="num">Meta semanal</th><th class="num">Meta por dia de estudo</th><th class="num">Registrado</th><th>Progresso (horas)</th><th class="num">Tópicos</th></tr></thead>
    <tbody>${linhas || '<tr><td colspan="7" class="muted">Sem metas nesta semana.</td></tr>'}</tbody></table></div>
    <p class="small muted" style="margin:8px 0 0">Meta diária: ${fmtH(S.config.horasDia * 60)} por dia. Registre as horas na aba “Tempo de estudos”.</p></details>`;
}

/* ---------- Ciclos ---------- */
function renderCiclo() {
  const cic = ciclo(), W = numSemanas(), wC = W >= 2 ? W - 1 : W;
  const mapa = atribuirDias(cic, S.config.discursiva ? +S.config.redacaoMin || 0 : 0, [0, 1, 2, 3, 4, 5]);
  const totalAss = S.materias.reduce((s, m) => s + m.assuntos.length, 0);
  const cob = S.materias.reduce((s, m) => s + m.assuntos.filter(a => S.cards.some(k => k.assuntoId === a.id && k.tipo === 'conteudo')).length, 0);
  let h = `<div class="kpis">
    <div class="kpi"><b>${fmtH(S.config.horasDia * 60)}</b><span>por dia</span></div>
    <div class="kpi"><b>${fmtH(minutosConteudoSemana())}</b><span>conteúdo novo por semana (seg–sáb${S.config.discursiva ? ', descontada a redação' : ''})</span></div>
    <div class="kpi"><b>${wC}</b><span>semanas de conteúdo + ${W - wC} de revisão</span></div>
    <div class="kpi"><b>${cob}/${totalAss}</b><span>assuntos cobertos no cronograma ${cob === totalAss ? '✓' : '⚠'}</span></div>
  </div>
  <div class="panel"><h3>Ciclo semanal (peso × incidência)</h3>
  <div class="tbl-wrap"><table><thead><tr><th>Matéria</th><th class="num">Questões</th><th class="num">Peso</th><th>Incidência</th><th class="num">Relevância</th><th class="num">% do ciclo</th><th class="num">Tempo/semana</th><th>Dias sugeridos</th></tr></thead><tbody>`;
  for (const x of cic) {
    h += `<tr><td><span class="dot" style="--c:${x.m.cor}"></span>${esc(x.m.nome)}</td><td class="num">${x.m.questoes}</td><td class="num">${x.m.peso}</td>
      <td><span class="tag inc-${x.m.incidencia}">${INC_LBL[x.m.incidencia]}</span></td><td class="num">${x.rel}</td>
      <td class="num">${(x.pct * 100).toFixed(1).replace('.', ',')}%</td><td class="num"><b>${fmtH(x.min)}</b></td>
      <td class="small">${(mapa[x.m.id] || []).map(d => DIAS[d]).join(', ')}</td></tr>`;
  }
  h += `</tbody></table></div><p class="small muted">Relevância = questões × peso × incidência (alta 3, média 2, baixa 1). Altere as horas/dia no topo para recalcular. Pares que não ficam no mesmo dia: ${(S.config.paresProibidos || []).map(([a, b]) => `${esc(mat(a)?.nome || a)} × ${esc(mat(b)?.nome || b)}`).join('; ') || 'nenhum'}.</p></div>`;

  h += `<div class="panel"><h3>Assuntos em cada ciclo (semana)</h3><p class="small muted" style="margin-top:0">Verde = finalizado. Todos os assuntos do edital entram até a semana ${wC}.</p>`;
  for (const m of S.materias) {
    const porSem = {};
    S.cards.filter(k => k.materiaId === m.id && k.tipo === 'conteudo').forEach(k => { const w = semanaDe(k.data); (porSem[w] ||= new Map()).set(k.assuntoId || k.id, k); });
    const linhas = Object.keys(porSem).map(Number).sort((a, b) => a - b).map(w => `<tr><td class="small" style="white-space:nowrap">S${w + 1}</td><td><div class="chips">${[...porSem[w].values()].map(k => {
      const nome = k.assuntoId ? assunto(k.assuntoId)?.a.nome || k.titulo : k.titulo;
      return `<span class="chip ${statusAssunto(k.assuntoId) === 'finalizado' || k.status === 'finalizado' ? 'ok' : ''}">${esc(nome)}</span>`; }).join('')}</div></td></tr>`).join('');
    h += `<details><summary><span class="dot" style="--c:${m.cor}"></span>${esc(m.nome)} <span class="muted small">(${m.assuntos.length} assuntos)</span></summary>
      <table style="margin:6px 0 12px"><tbody>${linhas || '<tr><td class="muted">Nenhum assunto planejado.</td></tr>'}</tbody></table></details>`;
  }
  return h + `</div>`;
}

/* ---------- Matérias ---------- */

    ${m.assuntos.map((a, ai) => {

}

/* ---------- Estatísticas ---------- */
function renderStats() {
  const W = numSemanas(), todos = topicos(S.cards);
  const totPlan = S.cards.reduce((s, k) => s + k.minutos, 0), totReal = S.registros.reduce((s, r) => s + r.minutos, 0);
  const q = S.registros.reduce((s, r) => s + (+r.questoes || 0), 0), e = S.registros.reduce((s, r) => s + (+r.erros || 0), 0);
  const w = Math.min(Math.max(0, semanaDe(hoje())), W - 1);
  let h = `<div class="kpis">
    <div class="kpi"><b>${pctFin(todos)}%</b><span>progresso total (${todos.filter(k => k.status === 'finalizado').length}/${todos.length} tópicos)</span></div>
    <div class="kpi"><b>${pctFin(topicos(cardsSemana(w)))}%</b><span>progresso da semana atual (S${w + 1})</span></div>
    <div class="kpi"><b>${fmtH(totReal)}</b><span>estudadas de ${fmtH(totPlan)} planejadas</span></div>
    <div class="kpi"><b>${q}</b><span>questões · acertos ${pctHtml(acertos(q, e))}</span></div>
  </div>`;
  const barra = (nome, cor, p, v) => `<div class="barrow"><div>${cor ? `<span class="dot" style="--c:${cor}"></span>` : ''}${esc(nome)}</div><div class="bar"><i style="width:${Math.min(100, p)}%;--c:${cor || 'var(--accent)'}"></i></div><div class="v">${v}</div></div>`;
  const dupla = (nome, cor, plan, real, max) => `<div class="barrow"><div>${cor ? `<span class="dot" style="--c:${cor}"></span>` : ''}${esc(nome)}</div>
    <div class="bar dupla" style="--c:${cor || 'var(--accent)'}"><i class="plan" style="width:${max ? 100 * plan / max : 0}%"></i><i class="real" style="width:${max ? Math.min(100, 100 * real / max) : 0}%"></i></div><div class="v">${fmtH(real)} / ${fmtH(plan)}</div></div>`;

  h += `<div class="panel"><h3>Progresso por matéria (% de tópicos finalizados)</h3>`;
  S.materias.forEach(m => { const l = todos.filter(k => k.materiaId === m.id); h += barra(m.nome, m.cor, pctFin(l), `${pctFin(l)}% · ${l.filter(k => k.status === 'finalizado').length}/${l.length}`); });
  h += `</div><div class="panel"><h3>Progresso semanal</h3>`;
  for (let i = 0; i < W; i++) { const l = topicos(cardsSemana(i)); h += barra(`S${i + 1} · ${fmtCurto(dataDe(i, 0))}${semanaRevisao(i) ? ' (revisão)' : ''}`, i === w ? 'var(--accent)' : '#8b8fa0', pctFin(l), `${pctFin(l)}% · ${l.filter(k => k.status === 'finalizado').length}/${l.length}`); }
  h += `</div><div class="panel"><h3>Horas estudadas × planejadas por matéria</h3><p class="small muted" style="margin-top:0">Barra clara: planejado · barra cheia: estudado</p>`;
  const pm = S.materias.map(m => ({ m, plan: S.cards.filter(k => k.materiaId === m.id).reduce((s, k) => s + k.minutos, 0), real: S.registros.filter(r => r.materiaId === m.id).reduce((s, r) => s + r.minutos, 0) }));
  const maxM = Math.max(1, ...pm.map(x => Math.max(x.plan, x.real)));
  pm.forEach(x => h += dupla(x.m.nome, x.m.cor, x.plan, x.real, maxM));
  h += `</div><div class="panel"><h3>Horas estudadas × planejadas por semana</h3>`;
  const ps = Array.from({ length: W }, (_, i) => ({ i, plan: cardsSemana(i).reduce((s, k) => s + k.minutos, 0), real: regsSemana(i).reduce((s, r) => s + r.minutos, 0) }));
  const maxS = Math.max(1, ...ps.map(x => Math.max(x.plan, x.real)));
  ps.forEach(x => h += dupla(`S${x.i + 1} · ${fmtCurto(dataDe(x.i, 0))}`, x.i === w ? 'var(--accent)' : '#8b8fa0', x.plan, x.real, maxS));
  h += `</div><div class="panel"><h3>Desempenho em questões por matéria</h3><div class="tbl-wrap"><table><thead><tr><th>Matéria</th><th class="num">Questões</th><th class="num">Erros</th><th class="num">Acertos</th></tr></thead><tbody>`;
  S.materias.forEach(m => { const l = S.registros.filter(r => r.materiaId === m.id); const q = l.reduce((s, r) => s + (+r.questoes || 0), 0), e = l.reduce((s, r) => s + (+r.erros || 0), 0);
    h += `<tr><td><span class="dot" style="--c:${m.cor}"></span>${esc(m.nome)}</td><td class="num">${q}</td><td class="num">${e}</td><td class="num">${pctHtml(acertos(q, e))}</td></tr>`; });
  return h + `</tbody></table></div></div>`;
}

/* ---------- Tempo de estudos ---------- */

function opcoesAss(mid, sel) { const m = mat(mid); return `<option value="">— geral da matéria —</option>` + (m ? m.assuntos.map(a => `<option value="${a.id}" ${a.id === sel ? 'selected' : ''}>${esc(a.nome)}</option>`).join('') : ''); }
function renderTempo() {
  const r = UI.editReg ? S.registros.find(x => x.id === UI.editReg) : null;
  const mid = r ? r.materiaId : S.materias[0]?.id;
  let h = `<div class="panel"><h3>${r ? 'Editar registro' : 'Novo registro de estudo'}</h3>

      <label>Data <input type="date" name="data" required value="${r ? r.data : hoje()}"></label>

      <label>Horas (00:00h) <input name="horas" required placeholder="01:30h" value="${r ? fmtH(r.minutos) : ''}" pattern="\\s*\\d{1,3}:[0-5]\\d\\s*[hH]?\\s*"></label>
      <label>Questões respondidas <input type="number" name="questoes" min="0" value="${r ? r.questoes : 0}"></label>
      <label>Erros <input type="number" name="erros" min="0" value="${r ? r.erros : 0}"></label>
      <label>Acertos <span id="prevPct" style="padding:6px 0">${pctHtml(r ? acertos(r.questoes, r.erros) : null)}</span></label>
      <div class="row"><button class="pri" type="submit">${r ? 'Salvar alterações' : 'Registrar'}</button>${r ? '<button type="button" data-acao="cancelReg">Cancelar</button>' : ''}</div>
    </form>
    <p class="small muted" style="margin-bottom:0">Acertos = (questões − erros) ÷ questões. <span class="pct r">&lt; 70%</span> <span class="pct y">70–80%</span> <span class="pct g">&gt; 80%</span></p></div>`;
  const l = [...S.registros].sort((a, b) => b.data.localeCompare(a.data) || (b.criado || 0) - (a.criado || 0));
  h += `<div class="panel"><h3>Histórico</h3><div class="tbl-wrap"><table><thead><tr><th>Data</th><th>Disciplina</th><th>Assunto</th><th class="num">Horas</th><th class="num">Questões</th><th class="num">Erros</th><th class="num">Acertos</th><th></th></tr></thead><tbody>
    ${l.map(x => { const m = mat(x.materiaId); return `<tr><td>${fmtBR(x.data)}</td><td>${m ? `<span class="dot" style="--c:${m.cor}"></span>${esc(m.nome)}` : '—'}</td>
      <td class="small">${esc(x.assuntoId ? assunto(x.assuntoId)?.a.nome || '—' : '—')}</td><td class="num">${fmtH(x.minutos)}</td><td class="num">${x.questoes}</td><td class="num">${x.erros}</td>
      <td class="num">${pctHtml(acertos(x.questoes, x.erros))}</td><td style="white-space:nowrap"><button class="icon" data-editreg="${x.id}" title="Editar">✎</button><button class="icon danger" data-delreg="${x.id}" title="Excluir">🗑</button></td></tr>`; }).join('') || '<tr><td colspan="8" class="muted">Nenhum registro ainda.</td></tr>'}
    </tbody></table></div></div>`;
  return h;
}
function montarTempo() {
  const f = $('#formReg'); if (!f) return;
  $('#regMat').onchange = e => { $('#regAss').innerHTML = opcoesAss(e.target.value); };
  const prev = () => { $('#prevPct').innerHTML = pctHtml(acertos(f.questoes.value, f.erros.value)); };
  f.questoes.oninput = prev; f.erros.oninput = prev;
  f.onsubmit = ev => {
    ev.preventDefault();
    const min = parseH(f.horas.value), q = +f.questoes.value || 0, e = +f.erros.value || 0;
    if (min === null) return toast('Use o formato 00:00h para as horas (ex.: 01:30h).');
    if (e > q) return toast('O número de erros não pode ser maior que o de questões.');
    const dados = { data: f.data.value, materiaId: f.materiaId.value, assuntoId: f.assuntoId.value || null, minutos: min, questoes: q, erros: e };
    if (UI.editReg) { Object.assign(S.registros.find(x => x.id === UI.editReg), dados); UI.editReg = null; toast('Registro atualizado.'); }
    else { S.registros.push({ id: uid(), criado: Date.now(), ...dados }); toast('Registro salvo.'); }
    salvar(); render();
  };
}

/* ================= Modais ================= */
function abrirModal(html) { $('#modalBody').innerHTML = html; $('#modal').showModal(); }
function fecharModal() { $('#modal').close(); }
function confirmar(msg) { return window.confirm(msg); }

function modalCard(card, dataPadrao) {
  const k = card || { materiaId: S.materias[0]?.id, assuntoId: '', titulo: '', data: dataPadrao || hoje(), minutos: 60, status: 'afazer', como: 'Questões', tipo: 'conteudo' };
  abrirModal(`<h2>${card ? 'Editar tópico' : 'Adicionar tópico'}</h2>
    <form id="formCard" class="form-grid">
      <label>Tipo <select name="tipo">${Object.entries(TIPOS).map(([v, n]) => `<option value="${v}" ${k.tipo === v ? 'selected' : ''}>${n}</option>`).join('')}</select></label>
      <label>Matéria <select name="materiaId" id="cMat"><option value="">— nenhuma —</option>${opcoesMat(k.materiaId)}</select></label>
      <label class="full">Assunto <select name="assuntoId" id="cAss">${opcoesAss(k.materiaId, k.assuntoId)}</select></label>
      <label class="full">Título <input name="titulo" value="${esc(k.titulo)}" placeholder="Deixe vazio para usar o nome do assunto"></label>
      <label>Data <input type="date" name="data" required value="${k.data}"></label>
      <label>Duração (00:00h) <input name="horas" required value="${fmtH(k.minutos)}"></label>
      <label>Status <select name="status">${Object.entries(STATUS).map(([v, n]) => `<option value="${v}" ${k.status === v ? 'selected' : ''}>${n}</option>`).join('')}</select></label>
      <label>Como concluir <select name="como">${COMO.map(o => `<option ${k.como === o ? 'selected' : ''}>${o}</option>`).join('')}</select></label>
      <label class="full">Anotações <textarea name="notas" rows="2">${esc(k.notas || '')}</textarea></label>
    </form>
    <div class="modal-f"><button data-acao="fechar">Cancelar</button><button class="pri" id="salvarCard">Salvar</button></div>`);
  const f = $('#formCard');
  $('#cMat').onchange = e => { $('#cAss').innerHTML = opcoesAss(e.target.value); };
  $('#salvarCard').onclick = () => {
    const min = parseH(f.horas.value); if (min === null) return toast('Use o formato 00:00h (ex.: 01:00h).');
    const aid = f.assuntoId.value || null, mid = f.materiaId.value || null;
    const titulo = f.titulo.value.trim() || (aid ? assunto(aid).a.nome : (mid ? mat(mid).nome : TIPOS[f.tipo.value]));
    const novo = { tipo: f.tipo.value, materiaId: mid, assuntoId: aid, titulo, data: f.data.value, minutos: min, como: f.como.value, notas: f.notas.value };
    const alvo = card || novoCard({ auto: false, ...novo });
    const v = checarMover({ ...alvo, ...novo }, novo.data);
    if (v.length && (!card || card.data !== novo.data || card.materiaId !== mid) && !confirmar(`Atenção:\n• ${v.join('\n• ')}\n\nSalvar mesmo assim?`)) return;
    if (card) Object.assign(card, novo); else S.cards.push(alvo);
    setStatus(alvo, f.status.value);
    salvar(); fecharModal(); render(); toast(card ? 'Tópico atualizado.' : 'Tópico adicionado.');
  };
}

      <label class="full">Concurso / cargo <input name="concurso" value="${esc(c.concurso)}"></label>
      <label>Banca <input name="banca" value="${esc(c.banca)}"></label>
      <label>Início dos estudos <input type="date" name="inicio" value="${c.inicio}" required></label>
      <label>Semanas (se prova a definir) <input type="number" name="semanas" min="1" max="104" value="${c.semanas}"></label>
      <label>Máx. disciplinas por dia <input type="number" name="max" min="1" max="6" value="${c.maxDisciplinasDia}"></label>
      <label><span><input type="checkbox" name="discursiva" ${c.discursiva ? 'checked' : ''}> Há prova discursiva (redação aos sábados)</span></label>
      <label>Redação no sábado (min) <input type="number" name="redacaoMin" min="0" step="15" value="${c.redacaoMin}"></label>
      <label class="full">Revisões espaçadas (dias, separados por vírgula) <input name="revs" value="${(c.revisoesDias || [1, 7, 30]).join(', ')}"></label>
      <div class="full campo">Pares que não podem cair no mesmo dia<div id="pares">${pares || '<span class="muted">Nenhum.</span>'}</div><button type="button" data-acao="addPar" style="align-self:flex-start">+ Par</button></div>
    </form>
    <div class="modal-f" style="justify-content:space-between;flex-wrap:wrap">
      <div class="row"><button class="danger" data-acao="reset" title="Recarrega o JSON embutido no arquivo">Restaurar dados do arquivo</button></div>
      <div class="row"><button data-acao="fechar">Cancelar</button><button data-acao="salvarCfgRegen">Salvar e regerar</button><button class="pri" data-acao="salvarCfg">Salvar</button></div>
    </div>`);
}
function lerConfig() {
  const f = $('#formCfg'), c = S.config;
  c.concurso = f.concurso.value.trim() || c.concurso; c.banca = f.banca.value.trim() || 'a definir';
  c.inicio = f.inicio.value || c.inicio; c.semanas = Math.max(1, +f.semanas.value || c.semanas);
  c.maxDisciplinasDia = Math.max(1, +f.max.value || 3); c.discursiva = f.discursiva.checked; c.redacaoMin = Math.max(0, +f.redacaoMin.value || 0);
  const revs = f.revs.value.split(/[,;\s]+/).map(Number).filter(n => n > 0); if (revs.length) c.revisoesDias = revs;
  c.paresProibidos = $$('#pares [data-par]').reduce((acc, s) => { const i = +s.dataset.par; (acc[i] ||= [])[+s.dataset.lado] = s.value; return acc; }, []).filter(p => p && p[0] && p[1] && p[0] !== p[1]);
}

/* ================= Backup ================= */
function exportar() {
  const blob = new Blob([JSON.stringify(S, null, 2)], { type: 'application/json' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
  a.download = `backup-estudos-${hoje()}.json`; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  toast('Backup exportado.');
}
function importar(file) {
  const r = new FileReader();
  r.onload = () => {
    try {
      const d = JSON.parse(r.result);
      if (!d.config || !Array.isArray(d.materias)) throw new Error('formato');
      if (!confirmar('Substituir todos os dados atuais pelo backup?')) return;
      S = d; S.cards ||= []; S.registros ||= []; S.meta ||= {};
      if (!S.cards.length) gerarCronograma();
      UI.semana = null; salvar(); render(); toast('Backup importado.');
    } catch (e) { toast('Arquivo inválido: use um JSON exportado pelo app ou no formato do JSON embutido.'); }
  };
  r.readAsText(file);
}

/* ================= Eventos ================= */
document.addEventListener('click', ev => {
  const t = ev.target.closest('button,[data-cal]'); if (!t) {
    if (UI.calOpen && !ev.target.closest('#calPop')) { UI.calOpen = false; $('#calPop')?.classList.remove('open'); }
    return;
  }
  const d = t.dataset;
  if (t.id === 'btnCal') { UI.calOpen = !UI.calOpen; $('#calPop').classList.toggle('open', UI.calOpen); return; }
  if (d.cal) { const b = UI.calMes || (S.config.prova ? pd(S.config.prova) : new Date()); UI.calMes = new Date(b.getFullYear(), b.getMonth() + (+d.cal), 1); $('#calPop').innerHTML = renderCal(); return; }
  if (UI.calOpen && !t.closest('#calPop')) { UI.calOpen = false; $('#calPop')?.classList.remove('open'); }
  if (t.id === 'btnConfig') return modalConfig();
  if (t.id === 'btnExport') return exportar();
  if (t.id === 'btnImport') return $('#fileImport').click();
  if (d.aba) { UI.aba = d.aba; salvar(); return render(); }
  if (d.sem) { UI.semana = +d.sem; return render(); }
  if (d.vista) { UI.vista = d.vista; salvar(); return render(); }
  if (d.add) return modalCard(null, d.add);
  if (d.edit) return modalCard(S.cards.find(k => k.id === d.edit));
  if (d.del) {
    const k = S.cards.find(k => k.id === d.del);
    if (k && confirmar(`Excluir o tópico “${k.titulo}”?`)) { S.cards = S.cards.filter(x => x.id !== k.id && !(x.origemId === k.id && x.status === 'afazer')); salvar(); render(); toast('Tópico excluído.'); }
    return;
  }
  if (d.editreg) { UI.editReg = d.editreg; render(); window.scrollTo({ top: 0, behavior: 'smooth' }); return; }
  if (d.delreg) { if (confirmar('Excluir este registro?')) { S.registros = S.registros.filter(r => r.id !== d.delreg); if (UI.editReg === d.delreg) UI.editReg = null; salvar(); render(); } return; }
  if (d.addass) { const nome = prompt('Nome do novo assunto:'); if (nome?.trim()) { const m = mat(d.addass); m.assuntos.push({ id: m.id + '_' + uid(), nome: nome.trim(), incidencia: 'media' }); salvar(); render(); toast('Assunto adicionado. Regere o cronograma ou adicione-o como tópico.'); } return; }
  if (d.renass) { const x = assunto(d.renass); const nome = prompt('Novo nome do assunto:', x.a.nome); if (nome?.trim()) { x.a.nome = nome.trim(); salvar(); render(); } return; }
  if (d.delass) { const x = assunto(d.delass); if (confirmar(`Excluir o assunto “${x.a.nome}” e seus tópicos no cronograma?`)) { x.m.assuntos = x.m.assuntos.filter(a => a.id !== d.delass); S.cards = S.cards.filter(k => k.assuntoId !== d.delass); salvar(); render(); } return; }
  if (d.renmat) { const m = mat(d.renmat); const nome = prompt('Novo nome da matéria:', m.nome); if (nome?.trim()) { m.nome = nome.trim(); salvar(); render(); } return; }
  if (d.delmat) { const m = mat(d.delmat); if (confirmar(`Excluir a matéria “${m.nome}”, seus assuntos e tópicos?`)) { S.materias = S.materias.filter(x => x.id !== m.id); S.cards = S.cards.filter(k => k.materiaId !== m.id); S.config.paresProibidos = S.config.paresProibidos.filter(p => !p.includes(m.id)); salvar(); render(); } return; }
  if (d.delpar !== undefined) { lerConfig(); S.config.paresProibidos.splice(+d.delpar, 1); return modalConfig(); }
  switch (d.acao) {
    case 'fechar': return fecharModal();
    case 'regerar':
      if (confirmar('Regerar o cronograma? Os blocos automáticos serão redistribuídos e seus status reiniciados. Tópicos adicionados manualmente e registros de horas são mantidos.')) { gerarCronograma(); salvar(); render(); toast('Cronograma regerado.'); }
      return;
    case 'addMat': {
      const nome = prompt('Nome da nova matéria:'); if (!nome?.trim()) return;
      const cores = ['#0b7285', '#5f3dc4', '#e8590c', '#087f5b', '#a61e4d', '#1864ab', '#5c940d'];
      S.materias.push({ id: 'm_' + uid(), nome: nome.trim(), cor: cores[S.materias.length % cores.length], questoes: 10, peso: 1, incidencia: 'media', assuntos: [] });
      salvar(); return render();
    }
    case 'addPar': lerConfig(); S.config.paresProibidos.push([S.materias[0]?.id, S.materias[1]?.id]); return modalConfig();
    case 'salvarCfg': case 'salvarCfgRegen': {
      const antes = numSemanas(); lerConfig();
      if (d.acao === 'salvarCfgRegen') { gerarCronograma(); toast('Configurações salvas e cronograma regerado.'); }
      else toast(numSemanas() !== antes ? 'Configurações salvas. O período mudou — regere o cronograma.' : 'Configurações salvas.');
      salvar(); fecharModal(); UI.semana = null; return render();
    }
    case 'reset':
      if (confirmar('Restaurar os dados do JSON embutido no arquivo? Todo o progresso salvo no navegador será apagado (exporte um backup antes).')) {
        S = dadosIniciais(); S.cards = []; S.registros = []; gerarCronograma(); salvar(); fecharModal(); UI.semana = null; render(); toast('Dados restaurados.');
      }
      return;
    case 'cancelReg': UI.editReg = null; return render();
  }
});

document.addEventListener('change', ev => {
  const t = ev.target, d = t.dataset;
  if (t.id === 'inHoras') return mudarHoras(t.value);
  if (t.id === 'inProva') { if (t.value) { S.config.prova = t.value; salvar(); UI.semana = null; render(); } return; }
  if (t.id === 'inDefinir') { S.config.prova = t.checked ? null : ($('#inProva').value || iso(addD(inicioSeg(), S.config.semanas * 7 - 1))); salvar(); UI.semana = null; return render(); }
  if (t.id === 'fileImport') { if (t.files[0]) importar(t.files[0]); t.value = ''; return; }
  if (d.como) { const k = S.cards.find(k => k.id === d.como); k.como = t.value; salvar(); return; }
  if (d.mcor) { mat(d.mcor).cor = t.value; salvar(); return render(); }
  if (d.mq) { mat(d.mq).questoes = Math.max(0, +t.value || 0); salvar(); return render(); }
  if (d.mp) { mat(d.mp).peso = Math.max(0, +t.value || 0); salvar(); return render(); }
  if (d.minc) { mat(d.minc).incidencia = t.value; salvar(); return render(); }
  if (d.ainc) { assunto(d.ainc).a.incidencia = t.value; salvar(); return render(); }
});
document.addEventListener('toggle', ev => { if (ev.target.id === 'metas') UI.metasOpen = ev.target.open; }, true);

/* Drag and drop */
let arrastando = null;
document.addEventListener('dragstart', ev => {
  const c = ev.target.closest?.('.card'); if (!c) return;
  arrastando = c.dataset.id; c.classList.add('drag');
  ev.dataTransfer.effectAllowed = 'move'; ev.dataTransfer.setData('text/plain', arrastando);
});
document.addEventListener('dragend', ev => { ev.target.closest?.('.card')?.classList.remove('drag'); $$('.col.over').forEach(x => x.classList.remove('over')); arrastando = null; });
document.addEventListener('dragover', ev => {
  const col = ev.target.closest?.('[data-drop-dia],[data-drop-st]'); if (!col || !arrastando) return;
  ev.preventDefault(); $$('.col.over').forEach(x => x !== col && x.classList.remove('over')); col.classList.add('over');
});
document.addEventListener('dragleave', ev => { const col = ev.target.closest?.('.col'); if (col && !col.contains(ev.relatedTarget)) col.classList.remove('over'); });
document.addEventListener('drop', ev => {
  const col = ev.target.closest?.('[data-drop-dia],[data-drop-st]'); if (!col || !arrastando) return;
  ev.preventDefault(); col.classList.remove('over');
  const card = S.cards.find(k => k.id === arrastando); if (!card) return;
  if (col.dataset.dropDia) {
    const dt = col.dataset.dropDia; if (dt === card.data) return;
    const v = checarMover(card, dt);
    if (v.length) {
      if (!confirmar(`Atenção — regra do planejamento:\n• ${v.join('\n• ')}\n\nMover mesmo assim?`)) return;
      toast('Movido com alerta: ' + v[0]);
    }
    card.data = dt; salvar(); render();
  } else {
    const antes = card.status; setStatus(card, col.dataset.dropSt);
    if (antes !== card.status) { render(); if (card.status === 'finalizado' && card.tipo !== 'conteudo') toast('Tópico finalizado.'); }
  }
});

/* Início */
carregar(); salvar(); render();
</script>
</body>
</html>
